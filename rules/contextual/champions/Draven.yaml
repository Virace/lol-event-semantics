scope: champion
owner: Draven
aliases:
  ChampionSelect:
    kind: generic_sfx_effect
    asset_kind: sfx
    component: champion_select_stinger
    label: 英雄选择短乐
    confidence: high
    source: manual_contextual_alias
    qualifiers:
      Stinger: 短促乐句
    note: Draven_ChampionSelect_Stinger 是英雄选择界面的短促音乐提示，不是技能事件。
  DoubleShot:
    kind: champion_spell_component
    spell: e
    component: twin_axe_projectile
    label: 双斧投射物
    confidence: medium
    source: manual_contextual_alias
    note: DoubleShot 在 Draven 事件中对应 E 技能 Stand Aside 的双斧投射表现，不作为全局 DoubleShot 
      词义。
  DravenAttackP:
    kind: champion_attack_component
    component: draven_axe_attack
    label: 投斧普攻
    confidence: high
    source: manual_contextual_alias
    qualifiers:
      L: 左手
      R: 右手
      LQ: 左手旋转飞斧
      RQ: 右手旋转飞斧
      LQC: 左手旋转飞斧暴击
      RQC: 右手旋转飞斧暴击
      RC: 右手暴击
    note: DravenAttackP 的 P 是内部攻击资源标记；L/R/Q/C 组合分别保留左右手、旋转飞斧与暴击语义，主动作仍是普通攻击。
  NewPassive:
    kind: champion_spell_component
    spell: p
    component: new_passive
    label: 新被动
    confidence: medium
    source: manual_contextual_alias
    note: NewPassive 在 Draven 事件中对应被动 League of Draven 的旧/内部表现名。
  SpinningAttack:
    kind: champion_spell_component
    spell: q
    component: spinning_axe_attack
    label: 旋转飞斧攻击
    confidence: medium
    source: manual_contextual_alias
    note: SpinningAttack 在 Draven 事件中对应 Q 技能 Spinning Axe 的攻击变体；数字尾缀作为 
      spell_rank 保留。
  SpinningAttack2Crit:
    kind: champion_spell_component
    spell: q
    component: spinning_axe_crit
    label: 旋转飞斧暴击
    confidence: medium
    source: manual_contextual_alias
    note: SpinningAttack2Crit 是 Draven Q 技能攻击变体的暴击事件，保留在 Draven 局部上下文内。
