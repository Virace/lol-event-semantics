scope: champion
owner: Zed
aliases:
  FastIn:
    kind: generic_sfx_effect
    asset_kind: sfx
    component: fast_in
    label: 快速进入
    confidence: medium
    source: manual_contextual_alias
    note: FastIn 在 Zed 事件中对应皮肤状态进入音效。
  HasteIn:
    kind: generic_sfx_effect
    asset_kind: sfx
    component: haste_in
    label: 加速进入
    confidence: medium
    source: manual_contextual_alias
    note: HasteIn 在 Zed 事件中对应皮肤加速状态进入音效。
  KillerCut:
    kind: champion_spell_component
    spell: p
    component: low_health_passive_proc
    label: 低血量被动斩击
    confidence: medium
    source: manual_contextual_alias
    note: KillerCut 在 Zed 事件中对应被动 Contempt for the Weak 对低血量目标的额外伤害触发。
  Marker:
    kind: champion_spell_component
    spell: r
    component: death_mark_marker
    label: 死亡印记标记
    confidence: medium
    source: manual_contextual_alias
    note: Marker 在 Zed 事件中对应 R 技能 Death Mark 的标记命中表现。
  ShadowDash:
    kind: champion_spell_component
    spell: w
    component: shadow_dash
    label: 影奥义！分身位移
    confidence: high
    source: manual_contextual_alias
    note: ShadowDash 在 Zed SFX 中对应 W 技能 Living Shadow 的分身位移表现。
  ShurikenMisOne:
    kind: champion_spell_component
    spell: q
    component: shuriken_missile
    label: 手里剑飞弹一
    confidence: medium
    source: manual_contextual_alias
    note: ShurikenMisOne 在 Zed 事件中对应 Q 技能 Razor Shuriken 的飞行物变体。
  ShurikenMisTwo:
    kind: champion_spell_component
    spell: q
    component: shuriken_missile
    label: 手里剑飞弹二
    confidence: medium
    source: manual_contextual_alias
    note: ShurikenMisTwo 在 Zed 事件中对应 Q 技能 Razor Shuriken 的飞行物变体。
  Ult:
    kind: champion_spell_component
    spell: r
    component: death_mark_hit
    label: 死亡印记命中
    confidence: medium
    source: manual_contextual_alias
    note: Ult 在 Zed 事件中按 R 技能 Death Mark 的命中表现处理，不泛化为全局 Ult。
  UltExecute:
    kind: champion_spell_component
    spell: r
    component: death_mark_execute
    label: 死亡印记处决
    confidence: medium
    source: manual_contextual_alias
    note: UltExecute 在 Zed 事件中对应 R 技能 Death Mark 的爆发/处决结算状态，不作为全局 execute 规则。
  ZedShadowDash:
    kind: champion_spell_component
    spell: w
    component: shadow_dash
    label: 影奥义！分身位移
    confidence: high
    source: manual_contextual_alias
    note: ZedShadowDash 在 ZedStormNinja 或带 owner 前缀的 SFX 中对应 W 技能 Living Shadow
      的分身位移表现。
  ZedShadowDashMissile:
    kind: champion_spell_component
    spell: w
    component: shadow_dash_missile
    label: 影子冲刺飞行物
    confidence: medium
    source: manual_contextual_alias
    note: ZedShadowDashMissile 在带 owner 前缀的 Zed SFX 中对应 W 技能 Living
      Shadow（影奥义！分身）的影分身突进飞行物，reference 描述「劫的影分身向前突进」。
  ZedShuriken:
    kind: champion_spell_component
    spell: q
    component: shuriken_cast
    label: 手里剑释放
    confidence: medium
    source: manual_contextual_alias
    note: ZedShuriken 在 ZedStormNinja 事件中对应 Q 技能 Razor Shuriken 释放。
