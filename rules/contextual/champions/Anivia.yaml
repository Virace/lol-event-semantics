scope: champion
owner: Anivia
aliases:
  AniviaEgg:
    kind: generic_sfx_effect
    asset_kind: sfx
    mode: ruby
    required_tokens:
      - Timer
    component: curse_egg_timer
    label: 冰晶凤凰蛋诅咒
    confidence: high
    source: manual_contextual_alias
    qualifiers:
      Timer: 计时器
    note: Ruby_Curse_AniviaEgg_Timer 是末日人机艾尼维亚 APC 的凤凰蛋诅咒计时机制。
  FlashFrostSpell:
    kind: champion_spell_component
    spell: q
    asset_kind: sfx
    component: flash_frost
    label: 寒冰闪耀
    confidence: high
    source: manual_contextual_alias
    note: FlashFrostSpell 是 Q 寒冰闪耀的飞行与爆炸音效，尾段 explode/end 由相位保留。
  FrashFrostSpell:
    kind: champion_spell_component
    spell: q
    component: flash_frost_stun
    label: 寒冰闪耀眩晕
    confidence: medium
    source: manual_contextual_alias
    note: FrashFrostSpell 是 Anivia Flash Frost 的旧/拼写变体，事件中对应命中眩晕表现。
  GlobalWallMarker:
    kind: champion_spell_component
    spell: w
    component: global_wall_marker
    label: 冰墙全局标记
    confidence: medium
    source: manual_contextual_alias
    note: GlobalWallMarker 在 Anivia 事件中对应 W 技能 Crystallize 的墙体标记状态。
