  Horn:
    kind: generic_sfx_effect
    asset_kind: sfx
    component: skin_horn
    label: 号角
    confidence: medium
    source: manual_contextual_alias
    note: Horn 在 NunuSkin04 事件中对应皮肤号角释放音效。
  StructureAttack:
    kind: champion_attack_component
    component: structure_attack
