scope: champion
owner: Diana
aliases:
  ArcThrow:
    kind: champion_spell_component
    spell: q
    component: crescent_strike_arc
    label: 新月打击弧形投掷
    confidence: medium
    source: manual_contextual_alias
    note: ArcThrow 对应 Q 技能 Crescent
      Strike（新月打击）「释放一道月能光束，对弧形范围内的敌人造成伤害」的弧形投射；hit/miss 相位表明是可落空的飞行物，Q 是 Diana
      唯一此类技能。
  DianaSolarBarrier:
    kind: generic_sfx_effect
    asset_kind: sfx
    mode: ruby
    component: doom_bot_solar_barrier
    label: 日光屏障
    confidence: high
    source: manual_contextual_alias
    qualifiers:
      hitwhiff: 擦碰未命中
    note: Ruby_DianaSolarBarrier 是末日人机黛安娜 APC 的特殊日光屏障效果，不据名称借用关系硬映射到常规技能槽位。
  DianaSolarFlare:
    kind: generic_sfx_effect
    asset_kind: sfx
    mode: ruby
    component: doom_bot_solar_flare
    label: 日炎耀斑
    confidence: high
    source: manual_contextual_alias
    note: Ruby_DianaSolarFlare 是末日人机黛安娜 APC 的特殊日炎耀斑效果，不伪装成常规英雄技能。
  DianaVortex:
    kind: champion_spell_component
    spell: r
    component: moonfall_vortex
    label: 月之降临旋涡
    confidence: medium
    source: manual_contextual_alias
    note: DianaVortex 与既有 VortexUlt 同源，对应 R 技能 Moonfall（月之降临）聚拢敌人的旋涡表现。
  Orbs:
    kind: champion_spell_component
    spell: w
    component: orbiting_orbs
    label: 环绕法球
    confidence: medium
    source: manual_contextual_alias
    note: Orbs 在 Diana 事件中对应 W 技能 Pale Cascade 的环绕球体表现。
  Shield:
    kind: champion_spell_component
    spell: w
    component: pale_cascade_shield
    label: 苍白之瀑护盾
    confidence: medium
    source: manual_contextual_alias
    note: Shield 在 Diana 事件中对应 W 技能 Pale Cascade 的护盾状态。
  Teleport:
    kind: champion_spell_component
    spell: e
    component: dash_or_teleport
    label: 冲刺位移
    confidence: medium
    source: manual_contextual_alias
    note: Teleport 在 Diana 事件中对应 Lunar Rush 的位移表现；该词只在 Diana 上下文中绑定到技能。
  VortexUlt:
    kind: champion_spell_component
    spell: r
    component: vortex_ultimate
    label: 旋涡大招
    confidence: medium
    source: manual_contextual_alias
    note: VortexUlt 在 Diana 事件中带有 Ult 后缀，按 R 技能 Moonfall 的聚拢/落月表现处理。
