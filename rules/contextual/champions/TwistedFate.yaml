scope: champion
owner: TwistedFate
aliases:
  BlueCardPreattack:
    kind: champion_spell_component
    spell: w
    component: blue_card_preattack
    label: 选牌蓝牌攻击前
    confidence: high
    source: manual_contextual_alias
    note: BlueCardPreattack 在 TwistedFate SFX 中对应 W 技能 Pick a Card 选中蓝牌后的攻击前状态。
  CardmasterStackParticle:
    kind: champion_spell_component
    spell: e
    component: cardmaster_stack_particle
    label: 卡牌骗术层数粒子
    confidence: high
    source: manual_contextual_alias
    note: CardmasterStackParticle 在 TwistedFate SFX 中对应 E 技能 Stacked
      Deck/CardmasterStack 的层数粒子状态。
  Gate:
    kind: champion_spell_component
    spell: r
    component: portal
    label: 传送门
    confidence: medium
    source: manual_contextual_alias
    note: Gate 在卡牌大师事件中指向 R 技能传送门组件，不作为全局 Gate 词义。
  Instagate:
    kind: champion_spell_component
    spell: r
    asset_kind: sfx
    component: destiny_gate_marker
    label: 命运传送标记
    confidence: high
    source: manual_contextual_alias
    note: TwistedFateSkin*_Instagate_marker 是 R 命运传送门的落点标记音效。
  SealFateMissile:
    kind: champion_spell_component
    spell: q
    component: seal_fate_missile
    label: 命运封印飞弹
    confidence: medium
    source: manual_contextual_alias
    note: SealFateMissile 在 TwistedFate 事件中对应 Q 技能 Wild Cards 的飞弹表现。
