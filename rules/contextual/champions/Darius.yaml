scope: champion
owner: Darius
aliases:
  AxeGrabCone:
    kind: champion_spell_component
    spell: e
    component: axe_grab_cone
    label: 斧钩锥形范围
    confidence: medium
    source: manual_contextual_alias
    note: AxeGrabCone 在 Darius 事件中对应 E 技能 Apprehend 的锥形抓取范围。
  Cleave:
    kind: champion_spell_component
    spell: q
    component: cleave
    label: 斩击
    confidence: medium
    source: manual_contextual_alias
    note: DariusCleave 在旧内部命名中对应 Q 技能斩击表现，不作为全局 Cleave 词义。
  Hemo:
    kind: champion_spell_component
    spell: p
    component: hemorrhage_stack
    label: 出血层数
    confidence: medium
    source: manual_contextual_alias
    note: Hemo 在 Darius 事件中对应被动 Hemorrhage 的出血层数/最大层数状态。
  HemoMax:
    kind: champion_spell_component
    spell: p
    component: hemorrhage_max_stack
    label: 出血最大层数
    confidence: high
    source: manual_contextual_alias
    note: HemoMax 在 Darius 事件中明确表示被动 Hemorrhage 已达到最大出血层数。
  NorseKing:
    kind: generic_sfx_effect
    asset_kind: sfx
    required_tokens:
      - Recall
    component: norse_king_recall
    label: 北欧之王回城
    confidence: high
    source: manual_contextual_alias
    qualifiers:
      Recall: 回城
    note: Darius_NorseKing_Recall_windup 是旧皮肤主题回城起手音效，NorseKing 是主题名而非实体。
  NoxianTacticsONH:
    kind: champion_spell_component
    spell: w
    component: noxian_tactics_onhit
    label: 诺克萨斯战术命中强化
    confidence: medium
    source: manual_contextual_alias
    note: NoxianTacticsONH 在 Darius 事件中表现为 on-hit 强化状态，按 W 技能 Crippling Strike 
      的旧/内部名处理。
  NoxianTacticsONHAttack:
    kind: champion_spell_component
    spell: w
    component: noxian_tactics_attack
    label: 诺克萨斯战术强化攻击
    confidence: medium
    source: manual_contextual_alias
    note: NoxianTacticsONHAttack 在 Darius 事件中表现为 W 技能强化攻击，不作为全局 ONH 规则。
