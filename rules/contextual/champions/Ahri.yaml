      Burst: 爆发
      Intro: 入场
      Gear: 装备
    note: AhriSkin86 的 Evolve_Burst/Intro_Gear 是皮肤进化表现；所有中间变体词必须进入结构化修饰语。
  Faker:
    kind: generic_sfx_effect
    asset_kind: sfx
    required_tokens:
      - Emote
    component: faker_emote
    label: 李相赫主题表情
    confidence: high
    source: manual_contextual_alias
    note: AhriSkin86 的 Emote_Faker 是李相赫主题表情音效；Faker 是主题名，不是英雄实体或技能槽位。
  Tower:
    kind: generic_sfx_effect
    asset_kind: sfx
    component: tower_effect
    label: 防御塔音效
    confidence: high
    source: manual_contextual_alias
    qualifiers:
      Finisher: 终结
      Signature: 标志变体
    note: AhriSkin86 的 Tower_Finisher/Signature 是皮肤防御塔终结表现，不是技能事件。
  Transformation:
    kind: champion_spell_component
    spell: r
    component: transformation
    label: 形态变化
    confidence: medium
    source: manual_contextual_alias
    note: Transformation 在 AhriSkin27 事件中对应皮肤/大招相关形态变化音效。
