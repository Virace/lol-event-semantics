  dance: {zh_CN: 舞蹈, en_US: dance}
  recall_sfx: {zh_CN: 回城音效, en_US: recall sfx}
  death_sfx: {zh_CN: 死亡音效, en_US: death sfx}
  respawn_sfx: {zh_CN: 重生音效, en_US: respawn sfx}
  idle_sfx: {zh_CN: 待机音效, en_US: idle sfx}
  homeguard_sfx: {zh_CN: 家园卫士音效, en_US: homeguard sfx}
  winddown_sfx: {zh_CN: 收招音效, en_US: wind-down sfx}
  execute_action: {zh_CN: 处决动作, en_US: execute action}
  attack_sfx: {zh_CN: 攻击音效, en_US: attack sfx}
  dance_sfx: {zh_CN: 舞蹈音效, en_US: dance sfx}
  joke_sfx: {zh_CN: 玩笑音效, en_US: joke sfx}
  laugh_sfx: {zh_CN: 大笑音效, en_US: laugh sfx}
  taunt_sfx: {zh_CN: 嘲讽音效, en_US: taunt sfx}

