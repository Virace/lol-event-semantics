announcer:
  # 播报员事件词表（批次5a 第一批，主代理裁决，逐字使用）。
  # event 的 key 为剥去 On 时机前缀与队伍尾缀后的英文词干（精确匹配），
  # value 为中文词条；team 的 key 为队伍尾缀规范写法（builder 按大小写
  # 不敏感剥一个尾缀），value 为中文方位词。防错优先：表外词干一律不建
  # frame，维持 legacy「播报员事件」展示，不硬造中文也不放英文 fallback。
  # 第二批（2026-07-18 网搜核验后收录）：连杀系/Shutdown/UnrealKill/
  # Dampener 系/TurretLostFirstBlood，一手证据为国服客户端字符串表
  # （CommunityDragon 镜像，9.10 fontconfig 与最新 stringtable 中英同键
  # 对照）。三个反社区惯称修正：Godlike=接近神（非「超神」）、
  # Legendary=超神、Rampage=接近暴走（非「暴走」）。Dampener 经同键
  # 中英互证为 Inhibitor（召唤水晶）引擎旧名；TurretLostFirstBlood
  # 官方文案「摧毁了第一座（防御）塔」，「一血塔」判为非官方不用。
  # You/Hero 中缀变体语义已核验（2026-07-19 核验代理，16.14 国服字符串表
  # game_announcement_* 键系统中英同键对照：You=你/本机玩家、Hero=非本机
  # 英雄、队伍尾缀=主体所属队伍、Blue/Red=观战视角；语料无 YouEnemyTeam
  # 组合自洽佐证），主体词见 subject 子表。**Shutdown 三态主体方向（终结
  # 者还是被终结者）字符串表无法区分，排除待音频原声核对；KillChampion
  # 复合形态（击杀者/被杀者/队伍三槽）推断置信高但未逐条核对，留后批**。
  # 包名（Worlds23=2023全球总决赛/Brawl=神木之门/NexusBlitz=极限闪击/
  # Maverick=进步之桥播报员内部代号无官方中文名）已核验但本域不进
  # arguments，留 mode role 设计时接入。扩词条改这里、不改代码。
  subject:
    # 播报主体三态（批次6e）：措辞取字符串表实际用词（你已被击杀/友方被杀/
    # 敌方英雄/蓝方红方队伍词），组合词由已核验成分构成。
    You: 你
    HeroYourTeam: 友方英雄
    HeroEnemyTeam: 敌方英雄
    HeroBlue: 蓝方英雄
    HeroRed: 红方英雄
  mode:
    # 播报语音包/模式前缀（批次6e mode role）：key 为 cue_path 包名段
    # （builder 先剥 Female1/Male1 人声前缀再查）。词条沿批次5a 核验
    # （Worlds23=2023全球总决赛/NexusBlitz=极限闪击/Brawl=神木之门）；
    # Pyke=派克（reference 官方名）+「通告员」——国服客户端对 announcer 的
    # 统一译名（字符串表「派克 通告员已启用！」，2026-07-20 用户终审）。表外包名
    # （RhaastKayn/Maverick/Pundit/Ringcaller 内部代号或未核验）不出
    # mode argument，事件本体照常建 frame。
    Worlds23: 2023全球总决赛
    NexusBlitz: 极限闪击
    Brawl: 神木之门
    Pyke: 派克通告员
  event:
