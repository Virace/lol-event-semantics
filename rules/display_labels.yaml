# normalized translation 展示词表。
#
# 本文件承载 normalized_translation_builder.py 中 phase / action /
# ability_component / gameplay_event 四类 translation argument 的中英文展示
# label，原为代码内联 dict（T3.3 外置），扩展词条改这里、不改代码。
# loader：src/lol_event_semantics/display_labels.py；词表缺词条时按既有
# key/token fallback 兜底、不抛错（详见 loader 与 builder 对应函数）。

phase:
  # phase argument：技能/状态/流程阶段展示词；key 为 phase_key() 产出的规范阶段键。
  state_activate: {zh_CN: 状态启动, en_US: state started}
  state_deactivate: {zh_CN: 状态结束, en_US: state ended}
  cast: {zh_CN: 释放, en_US: cast}
  in: {zh_CN: 进入, en_US: in}
  out: {zh_CN: 退出, en_US: out}
  segment: {zh_CN: 片段, en_US: segment}
  leadin: {zh_CN: 引入, en_US: lead in}
  leadout: {zh_CN: 引出, en_US: lead out}
  winddown: {zh_CN: 收尾, en_US: wind down}
  hit: {zh_CN: 命中, en_US: hit}
  revive: {zh_CN: 复活, en_US: revive}
  phase_select: {zh_CN: 阶段选择, en_US: phase select}
  missile_launch: {zh_CN: 弹道发射, en_US: missile launch}
  missile_cast: {zh_CN: 飞弹施放, en_US: missile cast}
  launch: {zh_CN: 发射, en_US: launch}
  end: {zh_CN: 结束, en_US: end}
  start: {zh_CN: 开始, en_US: start}
  land: {zh_CN: 落地, en_US: land}
  detonate: {zh_CN: 引爆, en_US: detonate}
  charge: {zh_CN: 蓄力, en_US: charge}
  fullcharge: {zh_CN: 满蓄力, en_US: full charge}
  stop: {zh_CN: 停止, en_US: stop}
  miss: {zh_CN: 落空, en_US: miss}
  catch: {zh_CN: 抓取, en_US: catch}
  return: {zh_CN: 返回, en_US: return}
  ready: {zh_CN: 就绪, en_US: ready}
  swap: {zh_CN: 切换, en_US: swap}
  reset: {zh_CN: 重置, en_US: reset}
  # spell rank 语音阶段（批次5b）：SpellXD{QWER}Rank{One,Two,Three} 的等级档位。
  # 实测语料只有 1-3 级（RankOne 78 / RankTwo 6 / RankThree 3），不预置更高档位。
  rankone: {zh_CN: 1级, en_US: rank 1}
  ranktwo: {zh_CN: 2级, en_US: rank 2}
  rankthree: {zh_CN: 3级, en_US: rank 3}
  # media_base cue 尾段相位（批次6a）：builder 级尾段门禁产出，拆解层不产出
  # 这些 key（门禁清单见 normalized_translation_builder.MEDIA_BASE_TAIL_PHASES）。
  windup: {zh_CN: 起手, en_US: wind up}
  loop: {zh_CN: 循环, en_US: loop}
  # 无尾段整段音效（批次6a）：key=overall 断言「整段、无特定相位段」；
  # 不硬造 state_activate 等时机语义。2026-07-19 审计后由「音效」改
  # 「整段音效」——保留 overall 与分段相位（引入/循环/收尾）的层级区分。
  overall: {zh_CN: 整段音效, en_US: full sfx}
  # frame 专属生命周期：不再把效果、音效与攻击动作统一写成“状态启动”。
  effect_activate: {zh_CN: 生效, en_US: effect active}
  effect_deactivate: {zh_CN: 结束, en_US: effect ended}
  audio_start: {zh_CN: 开始, en_US: audio started}
  audio_end: {zh_CN: 结束, en_US: audio ended}
  attack_cast: {zh_CN: 出手, en_US: attack cast}

action:
