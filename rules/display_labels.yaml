    InhibitorRespawnSoon: 召唤水晶即将重生
    GameStart: 游戏开始
    Reconnect: 重新连接
    LowHealth: 生命值过低
    KillingSpree: 大杀特杀
    KillingSpreeSet1: 大杀特杀
