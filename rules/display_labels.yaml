    InhibitorLost: 失去召唤水晶
    InhibitorRespawn: 召唤水晶已重生
    InhibitorRespawnSoon: 召唤水晶即将重生
    GameStart: 游戏开始
    Reconnect: 重新连接
    LowHealth: 生命值过低
