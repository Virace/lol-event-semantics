shop:
  # 商店老板语音词表（批次6d）。action 为动作词双语对（表外动作词不建
  # frame）；subject 为对象 token 中文词条——只收「条件触发」与「装备名」
  # 两类（英雄/皮肤 token 走 champion_labels/skin 解析链、地区阵营走
  # counterpart 词表，均不入此表）。条件词是 cue 内部触发条件的描述性
  # 转写（引擎内部名，无官方中文对照，同 phase 词口径）；装备名须
  # Data Dragon zh_CN 一手核验后才入表，宁缺毋错。
  # 2026-07-19 审计修正（官方 wiki 语音小节标题逐字对照）：Open=玩家进店
  # 时店主招呼（Upon Entering the Shop）故「进店」非「开店」；Close=离店
  # 道别（Upon Leaving the Shop）故「离店」非「关店」；Ambient=玩家在店旁
  # 闲置时店主独白（While Idling Near the Shop）故「闲聊」。FrozenMallet
  # 为已从常规商店移除的老装备（现以 id 4014 存在于限定模式）。
  action:
    open: {zh_CN: 进店, en_US: shop enter}
    purchase: {zh_CN: 购买, en_US: purchase}
    close: {zh_CN: 离店, en_US: shop leave}
    browsing: {zh_CN: 浏览, en_US: browsing}
    ambient: {zh_CN: 闲聊, en_US: idle chatter}
  subject:
    # 条件触发（描述性转写；CountSeven/Count10/CountTen 语义未证实不入表）
    First: 首次
    NoPurchase: 未购买
    Gold3000: 金币达3000
    GameTimer25: 游戏时间25分钟
    GameTimerTwentyFive: 游戏时间25分钟
    NearbyEnemyCount2: 附近有两名敌人
    NearbyEnemyCountTwo: 附近有两名敌人
    # 按字面转写的价格阈值条件（Data Dragon 证实非装备名；语义推断标注
    # 见核验报告：总价≥2900 的传说级价位段装备）
    MinimumPrice2900: 售价不低于2900
    # 装备名（2026-07-19 核验代理，Data Dragon en/zh 同版本同 item id 成对
    # 一手证据：16.14.1 为主，FrozenMallet=8.24.1 id 3022、
    # FrostQueensClaim=7.24.2 id 3092 历史版本回溯；YommusGhostblade 为
    # cue 内部拼写变体（官方 Youmuu's），按去撇号空格模糊对齐命中）
    SpiritVisage: 振奋盔甲
    ScoutsSlingshot: 斥候弹弓
    LostChapter: 遗失的章节
    ElixirOfWrath: 愤怒合剂
    ElixirOfSorcery: 巫术合剂
    ElixirOfIron: 钢铁合剂
    BootsOfSwiftness: 轻灵之靴
    BandleglassMirror: 班德尔玻璃镜
    SeekersArmguard: 探索者的护臂
    FrozenMallet: 冰霜之锤
    FrostQueensClaim: 冰霜女皇的旨令
    RefillablePotion: 复用型药水
    HextechRocketbelt: 海克斯科技火箭腰带
    HextechAlternator: 海克斯科技发电机
    ExperimentalHexplate: 海克斯注力刚壁
    ChempunkChainsword: 炼金朋克链锯剑
    IonianBootsOfLucidity: 明朗之靴
    NavoriFlickerblade: 纳沃利烁刃
    SpearOfShojin: 朔极之矛
    Stormsurge: 风暴狂涌
    YommusGhostblade: 幽梦之灵

announcer:
  # 播报员事件词表（批次5a 第一批，主代理裁决，逐字使用）。
  # event 的 key 为剥去 On 时机前缀与队伍尾缀后的英文词干（精确匹配），
  # value 为中文词条；team 的 key 为队伍尾缀规范写法（builder 按大小写
  # 不敏感剥一个尾缀），value 为中文方位词。防错优先：表外词干一律不建
  # frame，维持 legacy「播报员事件」展示，不硬造中文也不放英文 fallback。
  # 第二批（2026-07-18 网搜核验后收录）：连杀系/Shutdown/UnrealKill/
  # Dampener 系/TurretLostFirstBlood，一手证据为国服客户端字符串表
  # （CommunityDragon 镜像，9.10 fontconfig 与最新 stringtable 中英同键
  # 对照）。三个反社区惯称修正：Godlike=接近神（非「超神」）、
  # Legendary=超神、Rampage=接近暴走（非「暴走」）。Dampener 经同键
  # 中英互证为 Inhibitor（召唤水晶）引擎旧名；TurretLostFirstBlood
  # 官方文案「摧毁了第一座（防御）塔」，「一血塔」判为非官方不用。
  # You/Hero 中缀变体语义已核验（2026-07-19 核验代理，16.14 国服字符串表
  # game_announcement_* 键系统中英同键对照：You=你/本机玩家、Hero=非本机
  # 英雄、队伍尾缀=主体所属队伍、Blue/Red=观战视角；语料无 YouEnemyTeam
  # 组合自洽佐证），主体词见 subject 子表。**Shutdown 三态主体方向（终结
  # 者还是被终结者）字符串表无法区分，排除待音频原声核对；KillChampion
  # 复合形态（击杀者/被杀者/队伍三槽）推断置信高但未逐条核对，留后批**。
  # 包名（Worlds23=2023全球总决赛/Brawl=神木之门/NexusBlitz=极限闪击/
  # Maverick=进步之桥播报员内部代号无官方中文名）已核验但本域不进
  # arguments，留 mode role 设计时接入。扩词条改这里、不改代码。
  subject:
    # 播报主体三态（批次6e）：措辞取字符串表实际用词（你已被击杀/友方被杀/
    # 敌方英雄/蓝方红方队伍词），组合词由已核验成分构成。
    You: 你
    HeroYourTeam: 友方英雄
    HeroEnemyTeam: 敌方英雄
    HeroBlue: 蓝方英雄
    HeroRed: 红方英雄
  mode:
    # 播报语音包/模式前缀（批次6e mode role）：key 为 cue_path 包名段
    # （builder 先剥 Female1/Male1 人声前缀再查）。词条沿批次5a 核验
    # （Worlds23=2023全球总决赛/NexusBlitz=极限闪击/Brawl=神木之门）；
    # Pyke=派克（reference 官方名）+「语音包」描述性后缀。表外包名
    # （RhaastKayn/Maverick/Pundit/Ringcaller 内部代号或未核验）不出
    # mode argument，事件本体照常建 frame。
    Worlds23: 2023全球总决赛
    NexusBlitz: 极限闪击
    Brawl: 神木之门
    Pyke: 派克播报员
  event:
    Ace: 团灭
    FirstBlood: 一血
    Victory: 胜利
    Defeat: 失败
    DoubleKill: 双杀
    ChampionDoubleKill: 双杀
    TripleKill: 三杀
    ChampionTripleKill: 三杀
    QuadraKill: 四杀
    ChampionQuadraKill: 四杀
    PentaKill: 五杀
    ChampionPentaKill: 五杀
    TurretDie: 防御塔被摧毁
