shop:
  # 商店老板语音词表（批次6d）。action 为动作词双语对（表外动作词不建
  # frame）；subject 为对象 token 中文词条——只收「条件触发」与「装备名」
  # 两类（英雄/皮肤 token 走 champion_labels/skin 解析链、地区阵营走
  # counterpart 词表，均不入此表）。条件词是 cue 内部触发条件的描述性
  # 转写（引擎内部名，无官方中文对照，同 phase 词口径）；装备名须
  # Data Dragon zh_CN 一手核验后才入表，宁缺毋错。
  # 2026-07-19 审计修正（官方 wiki 语音小节标题逐字对照）：Open=玩家进店
  # 时店主招呼（Upon Entering the Shop）故「进店」非「开店」；Close=离店
  # 道别（Upon Leaving the Shop）故「离店」非「关店」；Ambient=玩家在店旁
  # 闲置时店主独白（While Idling Near the Shop）故「闲聊」。FrozenMallet
  # 为已从常规商店移除的老装备（16.14.1 数据中保留 id 4014，purchasable=false
  # 且无上架地图，当前不可购）。
  action:
    open: {zh_CN: 进店, en_US: shop enter}
    purchase: {zh_CN: 购买, en_US: purchase}
    close: {zh_CN: 离店, en_US: shop leave}
    browsing: {zh_CN: 浏览, en_US: browsing}
    ambient: {zh_CN: 闲聊, en_US: idle chatter}
  subject:
    # 条件触发（描述性转写；CountSeven/Count10/CountTen 语义未证实不入表）
    First: 首次
    NoPurchase: 未购买
    Gold3000: 金币达3000
    GameTimer25: 游戏时间25分钟
    GameTimerTwentyFive: 游戏时间25分钟
    NearbyEnemyCount2: 附近有两名敌人
    NearbyEnemyCountTwo: 附近有两名敌人
    # 按字面转写的价格阈值条件（Data Dragon 证实非装备名；语义推断标注
    # 见核验报告：总价≥2900 的传说级价位段装备）
    MinimumPrice2900: 售价不低于2900
    # 装备名（2026-07-19 核验代理，Data Dragon en/zh 同版本同 item id 成对
