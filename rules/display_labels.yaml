  # 本表同时是 media_base 动作状态路由（批次5b）的动作词门禁：表外动作词
  # 不建 frame 维持 legacy，防错优先，严禁英文 fallback 进文案。
  recall: {zh_CN: 回城, en_US: recall}
  taunt: {zh_CN: 嘲讽, en_US: taunt}
  death: {zh_CN: 死亡, en_US: death}
