              sha256:6aee94e5b24802c6c40585d411e8cebb908ebfdd6cc2c8c26e969e300932a432
            value: 
              成为复仇之月的活化身，冲向一名敌人并造成魔法伤害。<br>【月神冲刺】在冲达一名被施加了【月光】效果的敌人时，会没有冷却时间。所有其它的敌人都将移除掉身上的【月光】效果，无论他们是否是【月神冲刺】的目标。
            first_seen: 16.5.1
            last_seen: 16.16.1
            similarity_to_previous:
            review_status: accepted
