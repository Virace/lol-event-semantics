      en_US:
        snapshots:
          - hash: 
              sha256:938c8b59e81ccf22af90c2272e02edb5343db3a68feea4a6aeebb6803cf3bb67
            value: Becomes the living embodiment of the vengeful moon, dashing 
              to an enemy and dealing magic damage.<br><br>Lunar Rush has no 
              cooldown when used to dash to an enemy afflicted with Moonlight. 
              All other enemies will have the Moonlight debuff removed 
              regardless of whether they were the target of Lunar Rush.
            first_seen: '16.5'
            last_seen: 16.16.1
            similarity_to_previous:
            review_status: accepted
            sources:
              - source: data_dragon
                first_seen: 16.5.1
                last_seen: 16.16.1
              - source: game_data
                first_seen: '16.5'
                last_seen: '16.16'
