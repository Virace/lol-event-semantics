            value: 俄洛伊和她创造的<font 
              color='#669900'>躯壳</font>会在附近的不可穿越的地形上生成触手。触手会挥向灵魂，<font 
              color='#669900'>躯壳</font>，以及俄洛伊的【严酷训诫】的受害者们。触手会在命中敌人时造成物理伤害，如果命中目标是英雄还会治疗俄洛伊。
            first_seen: 16.5.1
            last_seen: 16.14.1
