              sha256:bd0fecc3418739b2d08691aee35b04011fb2eb6ceb900e1f5394fe6034825dd6
            value: Illaoi and the <font color='#669900'>Vessels</font> she 
              creates spawn Tentacles on nearby impassible terrain. Tentacles 
              swing at spirits, <font color='#669900'>Vessels</font>, and 
              victims of Illaoi's Harsh lesson. Tentacles deal physical damage 
              to enemies hit, and will heal Illaoi if they damage a champion.
            first_seen: '16.5'
            last_seen: 16.14.1
            similarity_to_previous:
            review_status: accepted
            sources:
