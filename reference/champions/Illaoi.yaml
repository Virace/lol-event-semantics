    descriptions:
      en_US:
        snapshots:
          - hash: 
              sha256:8bfec21d065a0dce4fb19a2852f942fe5ad2009b5f18b3d60d4259afb5ded210
            value: Illaoi rips the spirit from a foe's body, forcing it to stand
              before her. Spirits echo a percentage of the damage they take to 
              the original target. If killed, or if the target gets too far from
              the spirit, the target will become a <font 
              color='#669900'>Vessel</font> and begin spawning Tentacles.
            first_seen: '16.5'
            last_seen: 16.14.1
            similarity_to_previous:
            review_status: accepted
            sources:
              - source: data_dragon
                first_seen: 16.5.1
                last_seen: 16.14.1
              - source: game_data
                first_seen: '16.5'
                last_seen: '16.14'
      zh_CN:
        snapshots:
          - hash: 
              sha256:2af5b43867df5367734cba526f771046998262a7acb502e17c36192cef78b5f1
            value: 俄洛伊把灵魂从一名敌人的肉身中扯出，强迫它站在她面前。 
              灵魂会将其所受的一部分伤害传递到本体上。如果灵魂被击杀，或者本体离灵魂过远，那么本体就会成为一个<font 
              color='#669900'>躯壳</font>并且开始生成触手。
            first_seen: 16.5.1
            last_seen: 16.14.1
            similarity_to_previous:
