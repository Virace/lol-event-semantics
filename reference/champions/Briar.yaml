        snapshots:
          - hash: 
              sha256:d337377eb37e847da6fab2a0c561b2c3c5d5a6d1266ce34748ddde581a297f7d
            value: Briar leaps forward and shatters her pillory, entering a 
              Blood Frenzy that causes her to relentlessly pursue the nearest 
              enemy (prioritizing champions). While frenzied, she gains 
              increased Attack Speed and Move Speed, and her attacks deal damage
              in an area around her target.<br><br>Briar can reactivate this 
              ability while frenzied to take a CHOMP out of her target on her 
