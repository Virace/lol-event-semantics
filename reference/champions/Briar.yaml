            value: Briar refocuses her mind, removing Blood Frenzy and 
              channeling energy into a powerful scream that damages and slows 
              enemies. While charging, she takes reduced damage and heals for a 
              portion of her max Health. A fully charged scream knocks foes 
              back, dealing additional damage and stunning those who collide 
              with a wall.
