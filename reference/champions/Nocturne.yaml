      zh_CN:
        snapshots:
          - hash: 
              sha256:a6493768085be09f5f0668bd00855e072b26d5d317f5d61b8a8c3b7a7c12c817
            value: 
              魔腾扔出一把暗影之刃，对敌人造成伤害并留下幽灵影径，并使受到伤害的敌方英雄也留下幽灵影径。在影径上时，魔腾无视任何碰撞体积，并且他的移动速度和攻击力也会得到提高。
