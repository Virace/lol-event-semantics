              sha256:fe6b131a297a769ff19f6db0e64d391af22feb13ff44ff1ccc3017c684d62d2e
            value: Talon sends out a volley of daggers that then return back to 
              him, dealing physical damage every time it passes through an 
              enemy. The returning blades deal bonus damage and slow units hit.
            first_seen: '16.5'
            last_seen: 16.5.1
            similarity_to_previous:
            review_status: accepted
            sources:
              - source: data_dragon
                version: 16.5.1
