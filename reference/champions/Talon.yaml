              version: 16.5.1
    descriptions:
      en_US:
        snapshots:
          - hash: 
              sha256:f1906c87a9c073798566741263fb74dee8599c1047cd30874bff424db93cc506
            value: Talon stabs the target unit. If they are within melee range, 
              this attack deals critical damage. If they are outside melee 
              range, Talon will leap at his target before stabbing them. Talon 
              refunds some health and cooldown if this ability kills the target.
            first_seen: '16.5'
            last_seen: 16.5.1
            similarity_to_previous:
            review_status: accepted
            sources:
              - source: data_dragon
                version: 16.5.1
              - source: game_data
                version: '16.5'
      zh_CN:
        snapshots:
          - hash: 
              sha256:20674ba8cf0f89fe5f4d39f0ea7a3aad14974988caef4865389e67125c432c5b
            value: 
              泰隆戳刺目标单位。如果目标在近战距离之内，那么这次攻击会造成致命伤害。如果目标在近战距离之外，那么泰隆将会跃向他的目标然后戳刺目标。如果这个技能击杀了泰隆的目标，那么就会返还给泰隆一些生命值和冷却时间。
            first_seen: 16.5.1
            last_seen: 16.5.1
            similarity_to_previous:
            review_status: accepted
            sources:
              - source: data_dragon
                version: 16.5.1
