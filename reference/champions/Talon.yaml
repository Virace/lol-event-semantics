      zh_CN:
        snapshots:
          - hash: 
              sha256:4a6b639f796eb68880b8c5dede86da5c8492d82929de49d7d26beb35ec3780d9
            value: 泰隆放出一排匕首，随后匕首会返回泰隆处，匕首每次穿过敌人时都会造成物理伤害。返程的匕首会造成额外伤害并使被命中的目标减速。
            first_seen: 16.5.1
