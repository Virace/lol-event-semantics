        snapshots:
          - hash: 
              sha256:7a94baf61bbeffa46a65589abedf61a2c539ab2ad8e3c7022313fbb209f4079d
            value: Talon's spells Wound champions and large monsters, stacking 
              up to 3 times. When Talon attacks a champion with 3 stacks of 
              Wound, they bleed for heavy damage over time.
            first_seen: '16.5'
            last_seen: 16.5.1
