              sha256:e88360d60ecb38bb70645d93f346072fd0abe62d59bbc42842cce6803053c7d5
            value: Talon vaults over any terrain or structure, up to a max 
              distance. This ability has a low cooldown, but puts the used 
              terrain on a long cooldown.
            first_seen: '16.5'
            last_seen: 16.5.1
