      zh_CN:
        snapshots:
          - hash: 
              sha256:a64d215536472a75ab31962350136137cb0ede6f37822d68002b953213067382
            value: 泰隆翻越任何地形或建筑物，有一个最大距离。这个技能的冷却时间很短，但是需要很长一段时间后才能再次翻越已经翻越过的地形。
