              version: 16.5.1
    descriptions:
      en_US:
        snapshots:
          - hash: 
              sha256:2639681e05136a44daa1c07c2dbc2704d9f11a46348ea384da16a436869032b4
            value: Talon disperses a ring of blades and becomes Invisible while 
              gaining additional Move Speed. When Talon emerges from 
              Invisibility, the blades converge on his location. Each time the 
              blades move, Shadow Assault deals physical damage to enemies hit 
              by at least one blade.
            first_seen: '16.5'
            last_seen: 16.5.1
            similarity_to_previous:
            review_status: accepted
            sources:
              - source: data_dragon
                version: 16.5.1
              - source: game_data
                version: '16.5'
      zh_CN:
        snapshots:
          - hash: 
              sha256:d0d54d7af322e7bbbeec3ed4b48efc630e6aebb7dd7a32e3e2d370833b64cff4
            value: 
              泰隆散出一圈刀刃并变为隐形状态，同时获得额外移动速度。当泰隆从隐形状态下现身时，刀刃会汇聚向泰隆处。刀刃的每段移动，都会让暗影突袭对被至少一枚刀刃命中的敌人造成物理伤害。
            first_seen: 16.5.1
            last_seen: 16.5.1
            similarity_to_previous:
            review_status: accepted
            sources:
              - source: data_dragon
                version: 16.5.1
