      zh_CN:
        snapshots:
          - hash: 
              sha256:a67269c918b49b5a0a81ba797aac371c797f16862406d440a6a353f62bfe760e
            value: 泰隆的技能会创伤英雄和大型野怪，可叠加3层。当泰隆用普攻攻击一个带有3层创伤效果的目标时，目标会流血，受到重度的持续伤害。
            first_seen: 16.5.1
            last_seen: 16.5.1
            similarity_to_previous:
            review_status: accepted
            sources:
              - source: data_dragon
