    descriptions:
      en_US:
        snapshots:
          - hash:
              sha256:5b5e086879c1e07362d1c8dc71bb4298337e70a235d5302c43c477c197383b5f
            value: "Aphelios wields 5 Lunari Weapons made by his sister Alune. He
              has access to two at a time: one main-hand and one off-hand. Each weapon
              has a unique Basic Attack and Ability. Attacks and abilities consume
              a weapon's ammo. When out of ammo, Aphelios discards the weapon and
              Alune summons the next of the 5. "
            first_seen: '16.5'
            last_seen: 16.20.8248524
            similarity_to_previous:
            review_status: accepted
            sources:
              - source: data_dragon
                first_seen: 16.5.1
                last_seen: 16.20.1
              - source: game_data
                first_seen: '16.5'
                last_seen: 16.20.8248524
      zh_CN:
        snapshots:
          - hash:
              sha256:97bc00f3e52350751f10294f2f278cf17395dbb8af923d12aa14fde6e7a45402
            value: '厄斐琉斯拥有5件由他妹妹拉露恩所制的皎月武器。他同一时间可以使用2件：1件主手武器和1件副手武器。每件武器都有1种独特的普攻方式和1个独特的技能。攻击和技能都会消耗该武器的弹药。在弹药耗尽后，厄斐琉斯会弃掉该武器，并且拉露恩会召唤下一件武器给厄斐琉斯。 '
            first_seen: 16.5.1
            last_seen: 16.20.8248524
            similarity_to_previous:
            review_status: accepted
            sources:
              - source: data_dragon
                first_seen: 16.5.1
                last_seen: 16.20.1
