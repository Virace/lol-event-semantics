                first_seen: 16.5.1
                last_seen: 16.20.1
              - source: game_data
                first_seen: '16.5'
                last_seen: 16.20.8248524
      zh_CN:
        snapshots:
          - hash:
              sha256:8c0ec41955f8c8590cf719c3c7febc68deef35fd9fef28e23ef00ed69098d79f
            value:
              厄斐琉斯拥有5个不同的主动技能，基于他的主手武器：<br><br>通碧(步枪)：长距离射击，能够标记目标来跟进一次长距离攻击。<br>断魄(短镰枪)：在快速奔跑的同时用两把武器攻击附近的敌人。<br>坠明(加农炮)：禁锢被这把武器减速的所有敌人。<br>荧焰(喷火器)：引爆锥形范围内的敌人并用你的副手武器攻击他们。<br>折镜(飞轮刃)：部署一个装备着你副手武器的驻灵。<br>
            first_seen: 16.5.1
            last_seen: 16.20.8248524
            similarity_to_previous:
            review_status: accepted
