    descriptions:
      en_US:
        snapshots:
          - hash:
              sha256:2fc4b24590d087580475d7039c09fe12f4395ac9ad717dd443ecde13e04948dd
            value: 'Aphelios has 5 different activated abilities, based on his main-hand
              weapon:<br><br>Calibrum (Rifle): Long range shot that marks its target
              for a long-range follow-up attack.<br>Severum (Scythe Pistol): Run fast
              while attacking nearby enemies with both weapons.<br>Gravitum (Cannon):
              Root all enemies slowed by this weapon.<br>Infernum (Flamethrower):
              Blast enemies in a cone and attack them with your off-hand weapon.<br>Crescendum
              (Chakram): Deploy a sentry that shoots your off-hand weapon.<br>'
            first_seen: '16.5'
            last_seen: 16.20.8248524
            similarity_to_previous:
            review_status: accepted
            sources:
