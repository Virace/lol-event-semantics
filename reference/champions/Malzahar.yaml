    descriptions:
      en_US:
        snapshots:
          - hash: 
              sha256:718226b60d05bbd559a04d103915968d35031f239a9cd72f00773f08fd55f901
            value: Malzahar infects his target's mind with cruel visions of 
              their demise, dealing damage over time. Using Malzahar's other 
              spells on the target will refresh the visions.<br><br>If the 
              target dies while afflicted by the visions, they pass on to a 
              nearby enemy unit and Malzahar gains Mana. Malzahar's Voidlings 
              are attracted to affected units.
            first_seen: '16.5'
            last_seen: 16.5.1
            similarity_to_previous:
            review_status: accepted
            sources:
              - source: data_dragon
                version: 16.5.1
              - source: game_data
                version: '16.5'
      zh_CN:
        snapshots:
          - hash: 
              sha256:d56f04927ee692390274e2cc7afee528ff030182c5a874c335601a5936638d44
            value: 
              玛尔扎哈将目标的惨死幻象侵入目标的意识中，造成持续伤害。玛尔扎哈对目标使用其它技能时会刷新幻象的持续时间。<br><br>如果目标在感染幻象期间死亡，那么幻象会传到附近的一个敌人身上，并且玛尔扎哈会回复法力值。玛尔扎哈的虚灵会优先攻击感染了幻象的单位。
            first_seen: 16.5.1
            last_seen: 16.5.1
            similarity_to_previous:
            review_status: accepted
            sources:
