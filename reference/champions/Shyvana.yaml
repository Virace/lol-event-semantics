    descriptions:
      en_US:
        snapshots:
          - hash: 
              sha256:d035b16d99968af296a8c2202e956f1835ee0c1bb75819ba899c3c1db6f15ec5
            value: "Shyvana surrounds herself in fire, dealing magic damage per second
              to nearby enemies and moving faster for 3 seconds, part of this damage
              is applied again when Shyvana basic attacks an enemy with Burnout active.
              The Move Speed reduces over the duration of the spell. Basic attacks
              extend the duration of Burnout. <br><br><font color='#FF3300'>Dragon
              Form: </font>Burnout grows in size."
            first_seen: '16.5'
            last_seen: 16.5.1
            similarity_to_previous:
            review_status: accepted
            sources:
              - source: data_dragon
                version: 16.5.1
              - source: game_data
                version: '16.5'
      zh_CN:
        snapshots:
          - hash: 
              sha256:65a7af74e86c7fad7c45c0a64888d3e85e4edf83986581c60a790540367fc2ba
            value: 
              希瓦娜将自己围在火焰之中，每秒对周围的敌人造成伤害，并能移动得更快，持续3秒。在这个技能开启时，希瓦娜的普攻会对敌人造成基于此技能伤害的额外伤害。移动速度加成会随着技能的持续时间而减少。普通攻击会延长烈火燎原的持续时间。<br><br><font
              color='#FF3300'>魔龙形态：</font>烈火燎原会随体积增长。
            first_seen: 16.5.1
            last_seen: 16.5.1
            similarity_to_previous:
            review_status: accepted
            sources:
              - source: data_dragon
                version: 16.5.1
