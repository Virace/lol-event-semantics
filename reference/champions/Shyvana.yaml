            value: "Shyvana strikes twice on her next attack and grants herself Attack
              Speed for her next attacks. Basic attacks reduce the cooldown of Twin
              Bite by 0.5 seconds.<br><br><font color='#FF3300'>Dragon Form: </font>Twin
              Bite cleaves all units in front of Shyvana."
