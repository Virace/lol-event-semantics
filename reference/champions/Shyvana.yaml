              sha256:de15fdaf9ff2f85e6f811f9cc05f7e3983dd03b20777adeb5bc3d598b104d8ff
            value: 希瓦娜的下次攻击将进行两次打击并为她接下来的若干次攻击提供攻击速度。每次普通攻击会减少【龙牙突刺】0.5 
              秒冷却时间。<br><br><font 
