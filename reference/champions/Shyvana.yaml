    descriptions:
      en_US:
        snapshots:
          - hash: 
              sha256:7cbea5d1cd23e4b07f50652b89d83a98ae8c5d5e943572be2275f3b09ebe0f20
            value: "Shyvana unleashes a fireball that deals damage to all enemies
              it encounters and leaves cinders on the target, marking them for 5 seconds.
              Shyvana's basic attacks on marked targets deal a percentage of their
              maximum Health as damage on-hit.<br><br><font color='#FF3300'>Dragon
              Form: </font>Flame Breath explodes on impact or at target location,
              dealing bonus damage and scorching the earth for a short duration."
            first_seen: '16.5'
            last_seen: 16.5.1
            similarity_to_previous:
            review_status: accepted
            sources:
              - source: data_dragon
                version: 16.5.1
              - source: game_data
                version: '16.5'
      zh_CN:
        snapshots:
          - hash: 
              sha256:b7dcb2049891512a7e4cfbc336cabc46f4a9eaca8e5ca1c1b9842279e28af7d1
            value: 
              希瓦娜放出一枚火球，对沿途的所有目标造成魔法伤害，并在目标身上留下熔化护甲的燃渣，持续5秒。希瓦娜对被标记目标进行的普通攻击，会造成基于目标最大生命值的额外伤害。<br><br><font
              color='#FF3300'>魔龙形态：</font>烈焰吐息会在碰撞或在抵达目标位置后爆炸，造成额外伤害并灼烧大地一小段时间。
            first_seen: 16.5.1
            last_seen: 16.5.1
            similarity_to_previous:
            review_status: accepted
            sources:
              - source: data_dragon
                version: 16.5.1
