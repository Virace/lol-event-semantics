      en_US:
        snapshots:
          - hash: 
              sha256:171fdec12d27213b54bc5396a4bab4f28c60436f273e1ee589735d6a059f4ffa
            value: Swain launches a wave of demonic power forward. It then 
              returns to Swain and roots enemies it hits. Swain can then choose 
              to pull all rooted champions closer. This ability has a shorter 
              cooldown during Demonic Ascension.
            first_seen: '16.5'
            last_seen: 16.5.1
            similarity_to_previous:
            review_status: accepted
            sources:
