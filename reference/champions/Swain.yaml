      zh_CN:
        snapshots:
          - hash: 
              sha256:d03ae4fcd8fff92ca37908eb5f280a1f768791c7fc4a9d75d6643e48534b601e
            value: 
              斯维因释放一道恶魔之手向前击出。手臂随后会返回至斯维因处，并禁锢它命中的敌人。斯维因之后可以选择将所有被禁锢的英雄们拉拽得更靠近他。这个技能在【恶魔升华】期间会有一个更短的冷却时间。
            first_seen: 16.5.1
            last_seen: 16.5.1
            similarity_to_previous:
            review_status: accepted
            sources:
              - source: data_dragon
                version: 16.5.1
