        snapshots:
          - hash: 
              sha256:d58f18a7f953546f56e927373d409f9f8538e70d7410a197c557d799da735273
            value: Swain transforms into a demon and drains health from nearby 
              enemy champions, minions, and neutral monsters. Swain can cast 
              Demonflare to decimate and slow nearby enemies with a nova of 
              soulfire. This form is indefinite as long as Swain drains enemy 
              champions.
            first_seen: '16.5'
            last_seen: 16.5.1
            similarity_to_previous:
            review_status: accepted
            sources:
