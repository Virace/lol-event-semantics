          - hash:
              sha256:e6d34067d33130b999e7a2bab0b24be48e09d5da5cca08c37f452d1f574a4f80
            value: Passively, Ryze's other basic abilities reset the cooldown of
              Overload and charge a rune. When Ryze casts Overload with 2 runes
              charged, he gains a brief burst of Move Speed.<br><br>On cast,
              Ryze throws a charge of pure energy in a line, dealing damage to
              the first enemy struck. If the target has Flux on it, Overload
              deals extra damage and bounces to nearby enemies with Flux.
