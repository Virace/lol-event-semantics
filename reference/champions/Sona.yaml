      en_US:
        snapshots:
          - hash:
              sha256:36667c3a4e57423eaa7774905d69cdcb3d665d4f99a14ff42802db216acc878b
            value: "<passive>Accelerando</passive>: Sona gains non-Ultimate ability
              haste permanently for her basic abilities as she uses her abilities
              well, up to a cap. Beyond that cap, further successful uses reduce her
              ultimate's remaining cooldown instead.<br><br><passive>Power Chord</passive>:
              Every few spell casts, Sona's next attack will deal bonus magic damage
              in addition to an additional effect based on what basic Ability Sona
              last activated."
