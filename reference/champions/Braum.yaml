      zh_CN:
        snapshots:
          - hash: 
              sha256:0cfd5dbc2f8f58e1bdf15e587f852a74ebb5292349c605115246569261a15b96
            value: 布隆的普通攻击会对目标施加震荡猛击效果。一旦施加了第一层震荡猛击，<font 
              color='#FFF673'>友军</font>的普通攻击也会对目标叠加震荡猛击。<br><br>在效果到达4层后，目标会被击晕并受到魔法伤害。在接下来的数秒里，布隆和友军无法再次对目标叠加震荡猛击的层数，但布隆的攻击会对目标造成额外魔法伤害。
            first_seen: 16.5.1
            last_seen: 16.5.1
            similarity_to_previous:
            review_status: accepted
            sources:
              - source: data_dragon
                version: 16.5.1
