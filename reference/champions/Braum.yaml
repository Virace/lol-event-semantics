        snapshots:
          - hash: 
              sha256:7d85ed59738fe683b1093cf4ef54986e2a640dfa5fd39fe2d110841377793a34
            value: 
              布隆朝一个方向举起盾牌，持续数秒，可以拦截所有敌方飞行道具，并将它们摧毁，但自身要承受这些飞行道具的伤害。在举盾后，布隆将使承受的第一次攻击变得完全无效，并降低来自这个方向的所有后续攻击的伤害。
            first_seen: 16.5.1
            last_seen: 16.5.1
