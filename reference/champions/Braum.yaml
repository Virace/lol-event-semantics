        snapshots:
          - hash: 
              sha256:5d2761984211d84e1c7bd2ebed8b95b583cc27984497f7695d4d0d7e0a9d56ec
            value: Braum's basic attacks apply Concussive Blows. Once the first 
              stack is applied, <font color='#FFF673'>ally</font> basic attacks 
              also stack Concussive Blows. <br><br>Upon reaching 4 stacks, the 
              target is stunned and takes magic damage. For the next few seconds
              they cannot receive new stacks, but take bonus magic damage from 
              Braum's attacks.
            first_seen: '16.5'
            last_seen: 16.5.1
            similarity_to_previous:
            review_status: accepted
            sources:
              - source: data_dragon
                version: 16.5.1
