spells:
  - slot: E
    ids:
      - value: YuumiE
        sources:
          - source: data_dragon
            version: 16.5.1
          - source: game_data
            version: '16.5'
    names:
      en_US:
        - value: Zoomies
          sources:
            - source: data_dragon
              version: 16.5.1
            - source: game_data
              version: '16.5'
      zh_CN:
        - value: 旺盛精力
          sources:
            - source: data_dragon
              version: 16.5.1
    descriptions:
      en_US:
        snapshots:
          - hash: 
              sha256:8a3efa4e29290da2d858927afa72b7d4516901374a3bf8ae5bf8fd337eed760b
            value: Shields Yuumi and boosts Move Speed and Attack Speed. If 
              she's attached, she passes it to her ally instead.<br>
            first_seen: '16.5'
            last_seen: 16.5.1
            similarity_to_previous:
            review_status: accepted
            sources:
              - source: data_dragon
                version: 16.5.1
              - source: game_data
                version: '16.5'
      zh_CN:
        snapshots:
          - hash: 
              sha256:1e62a09be3bd28fb2918b58a2f328bdc0ffa2e2f535feda4c80907dff864135c
            value: 为悠米提供护盾值和一个爆发性的移动速度和攻击速度加成。如果她处于附身状态，那么她会将这个效果传给她附身的友方英雄。<br>
            first_seen: 16.5.1
            last_seen: 16.5.1
            similarity_to_previous:
            review_status: accepted
            sources:
              - source: data_dragon
                version: 16.5.1
  - slot: P
    ids:
      - value: YuumiPassive
        sources:
          - source: data_dragon
            version: 16.5.1
          - source: game_data
            version: '16.5'
    names:
      en_US:
        - value: Feline Friendship
          sources:
            - source: data_dragon
              version: 16.5.1
            - source: game_data
              version: '16.5'
      zh_CN:
        - value: 猫的博爱
          sources:
            - source: data_dragon
              version: 16.5.1
    descriptions:
      en_US:
        snapshots:
          - hash: 
              sha256:2d19232ea888c14eebbeb5dbc8f11bba567607186ca30cfbe9fb87c2710eb811
            value: Periodically, when Yuumi strikes a champion with an attack or
              ability, she restores health to herself and the next ally she 
              Attaches to.<br><br>While Attached, Yuumi generates a special bond
              with her allies. The ally with the strongest bond enhances Yuumi's
              abilities while she is Attached to them.
            first_seen: '16.5'
            last_seen: 16.5.1
            similarity_to_previous:
            review_status: accepted
            sources:
              - source: data_dragon
                version: 16.5.1
              - source: game_data
                version: '16.5'
      zh_CN:
        snapshots:
          - hash: 
              sha256:1bc3fc01f600e0a019750e158c48f6f553f7d81b60ee43cc3840e904044c2ccd
            value: 
              周期性地，当悠米用一个攻击或技能击中一个英雄时，她会为自身和她要附身的下一个友方英雄回复生命值。<br><br>在附身于友方英雄时，悠米会与她的友方英雄们生成一个特殊羁绊。在附身于拥有最强羁绊的那名友方英雄时，悠米的各个技能会获得强化。
            first_seen: 16.5.1
            last_seen: 16.5.1
            similarity_to_previous:
            review_status: accepted
            sources:
              - source: data_dragon
                version: 16.5.1
  - slot: Q
    ids:
      - value: YuumiQ
        sources:
          - source: data_dragon
            version: 16.5.1
          - source: game_data
            version: '16.5'
    names:
      en_US:
        - value: Prowling Projectile
          sources:
            - source: data_dragon
              version: 16.5.1
            - source: game_data
              version: '16.5'
      zh_CN:
        - value: 摸鱼飞弹
          sources:
            - source: data_dragon
              version: 16.5.1
    descriptions:
      en_US:
        snapshots:
          - hash: 
              sha256:249d01a682d9acbb685e1e69bc782a7681f1af5030558c8511a5996d0258d759
            value: Yuumi fires a missile, dealing damage and slowing first 
              target hit. It deals bonus damage and an enchanced slow if it 
              takes at least 1.35 seconds to get to its target. While on her 
              Best Friend, the slow is always enhanced and grants bonus On-Hit 
              damage to her ally.<br><br>While Attached, the missile can be 
              controlled with your cursor for a brief period.
            first_seen: '16.5'
            last_seen: 16.5.1
            similarity_to_previous:
            review_status: accepted
            sources:
              - source: data_dragon
                version: 16.5.1
              - source: game_data
                version: '16.5'
      zh_CN:
        snapshots:
          - hash: 
              sha256:fdeecdd8afaa9b3a05dfe9a5decb6a60b6c000e3e0143695bf168546553669b6
            value: 
              悠米发射一道飞弹，对命中的首个单位造成伤害和减速效果。如果它在到达目标之前至少飞行了1.35秒，那么还会造成额外伤害和强化减速效果。在附身于她的挚友身上时，将总造成强化减速效果并且为她的挚友提供额外附加伤害。<br><br>在附身状态时，飞弹可以通过你的指针来控制。
            first_seen: 16.5.1
            last_seen: 16.5.1
            similarity_to_previous:
            review_status: accepted
            sources:
              - source: data_dragon
                version: 16.5.1
  - slot: R
    ids:
      - value: YuumiR
        sources:
          - source: data_dragon
            version: 16.5.1
          - source: game_data
            version: '16.5'
    names:
      en_US:
        - value: Final Chapter
          sources:
            - source: data_dragon
              version: 16.5.1
            - source: game_data
              version: '16.5'
      zh_CN:
        - value: 魔典终章
          sources:
            - source: data_dragon
              version: 16.5.1
    descriptions:
      en_US:
        snapshots:
          - hash: 
              sha256:31fd9092afe481e80af1aff2f930fe1d75ae9e1804b67d7eec423d96c204a009
            value: Yuumi channels five waves that damage enemies and heal 
              allies. Yuumi can move, attach, and cast Zoomies! while 
              channeling. While on her Best Friend, this spell also follows her 
              mouse.
            first_seen: '16.5'
            last_seen: 16.5.1
            similarity_to_previous:
            review_status: accepted
            sources:
              - source: data_dragon
                version: 16.5.1
              - source: game_data
                version: '16.5'
      zh_CN:
        snapshots:
          - hash: 
              sha256:5d10189d1509fadc6f3612a31adff9496e98166a191c8c91bf9b6a26424c9c52
            value: 
              悠米引导5道波纹来伤害敌人并治疗友军。在引导时，悠米可以移动、附身并施放【旺盛精力】。在附身于她的挚友身上时，这个技能还会跟随她的鼠标。
            first_seen: 16.5.1
            last_seen: 16.5.1
            similarity_to_previous:
            review_status: accepted
            sources:
              - source: data_dragon
                version: 16.5.1
  - slot: W
    ids:
      - value: YuumiW
        sources:
          - source: data_dragon
            version: 16.5.1
          - source: game_data
            version: '16.5'
    names:
      en_US:
        - value: You and Me!
          sources:
            - source: data_dragon
              version: 16.5.1
            - source: game_data
              version: '16.5'
      zh_CN:
        - value: 悠米出动！
          sources:
            - source: data_dragon
              version: 16.5.1
    descriptions:
      en_US:
        snapshots:
          - hash: 
              sha256:3f930c8a13016bab89f1bce964bed10f1a25f5dbfb679fad98d6e57622549b3d
            value: Yuumi dashes to a target ally, becoming untargetable from 
              everything except turrets. While on her Best Friend, she gains 
              Heal & Shield Power and grants her Ally On-Hit healing.
            first_seen: '16.5'
            last_seen: 16.5.1
            similarity_to_previous:
            review_status: accepted
            sources:
              - source: data_dragon
                version: 16.5.1
              - source: game_data
                version: '16.5'
      zh_CN:
        snapshots:
          - hash: 
              sha256:b50044a09194259c2a4d2e8bd5ac038957f9424bfb87e7d434aa557e6221820c
            value: 
              悠米突进到一名目标友方英雄处，变得不可被选取（防御塔除外）。在附身于她的挚友身上时，她会获得治疗与护盾强度并为她的这名友军提供附加治疗效果。
            first_seen: 16.5.1
            last_seen: 16.5.1
            similarity_to_previous:
            review_status: accepted
            sources:
              - source: data_dragon
                version: 16.5.1
