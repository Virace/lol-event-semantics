      en_US:
        snapshots:
          - hash: 
              sha256:4cf9cc0746fe0a170d1bf88d3a93b27feff4b42599c90850cf64c2496c26502a
            value: Ornn summons a massive elemental at a location which travels 
              toward him with increasing speed. Enemies run over by the 
              elemental take damage, are slowed and are made Brittle. Ornn can 
              recast the ability to charge into the elemental, redirecting it in
              the direction he hits it, causing the elemental to affect any 
              enemies it runs over to be knocked up, dealing the same damage and
              re-applying Brittle.
            first_seen: '16.5'
            last_seen: 16.5.1
            similarity_to_previous:
            review_status: accepted
            sources:
              - source: data_dragon
                version: 16.5.1
              - source: game_data
                version: '16.5'
      zh_CN:
        snapshots:
          - hash: 
              sha256:c8d4b2507c2e92368a8e9c8f6e97d7f09cbd7185bd7075e224c42eab864482e6
            value: 
              奥恩在目标位置召唤一个巨大的岩浆元素，岩浆元素会以逐渐提升的速度跑向奥恩。被岩浆元素途经的敌人会受到伤害、减速效果并被施加易碎效果。奥恩可以再次施放这个技能，以冲向岩浆元素，并在命中岩浆元素时重新导向岩浆元素，使岩浆元素可将途经的任何敌人击飞，造成等额的伤害并再次施加易碎效果。
            first_seen: 16.5.1
            last_seen: 16.5.1
            similarity_to_previous:
            review_status: accepted
