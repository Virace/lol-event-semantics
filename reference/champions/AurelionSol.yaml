    descriptions:
      en_US:
        snapshots:
          - hash: 
              sha256:3867979ecec410bbcb69a8831474b7b10cd954552850442f0c2c6391a6f0710d
            value: "Falling Star: Aurelion Sol crashes a star into the earth. This
              impact deals magic damage and stuns enemies while also granting Stardust
              for each enemy champion it hits. Gathering enough Stardust transforms
              Aurelion Sol's next Falling Star into The Skies Descend.<br><br>The
              Skies Descend: Aurelion Sol drags a giant star down from the heavens
              with an increased impact zone and increased damage, knocking up enemies
              rather than stunning them. A shockwave then spreads from the edge of
              the impact zone, which damages and slows the enemies it hits. Stardust
              increases the impact area of both Falling Star and The Skies Descend."
            first_seen: '16.5'
            last_seen: 16.14.1
            similarity_to_previous:
            review_status: accepted
            sources:
              - source: data_dragon
                first_seen: 16.5.1
                last_seen: 16.14.1
              - source: game_data
                first_seen: '16.5'
                last_seen: '16.14'
      zh_CN:
        snapshots:
          - hash: 
              sha256:c9ed0cac925c20572565aed6f8f4bf87dce5187dd8137baeb91a3bd987c8ec37
            value: 星落：奥瑞利安 · 
              索尔召唤一颗星辰坠落地面。这次冲击造成魔法伤害并眩晕敌人，并且每命中一个敌方英雄还会提供星尘。收集足够的星尘后，奥瑞利安·索尔的下一次星落将会升级为天瀑。<br><br>天瀑：奥瑞利安
              · 
              索尔从诸天拽下一颗巨大的星辰撞击地面，拥有提升过的冲击范围和提升过的伤害，并且会对敌人们造成击飞而非晕眩。随后会有一道冲击波从冲击范围的边缘散播出去，对命中的敌人们造成伤害和减速。星尘会提升【星落】和【天瀑】的冲击范围。
            first_seen: 16.5.1
            last_seen: 16.14.1
            similarity_to_previous:
