    descriptions:
      en_US:
        snapshots:
          - hash: 
              sha256:798a1956e93dff1411c17058528909434b7eac149e8e632801bcfff88b8d649a
            value: Aurelion Sol summons a black hole, damaging enemies and 
              slowly pulling them toward its center. This ability grants 
              Stardust each time an enemy dies within the black hole and for 
              each second an enemy champion is caught inside it. The center of 
              the black hole executes enemies who are below a certain percentage
              of their maximum health. Stardust increases Singularity's area as 
              well as the execution threshold.
            first_seen: '16.5'
            last_seen: 16.14.1
            similarity_to_previous:
            review_status: accepted
            sources:
              - source: data_dragon
                first_seen: 16.5.1
                last_seen: 16.14.1
              - source: game_data
                first_seen: '16.5'
                last_seen: '16.14'
      zh_CN:
        snapshots:
          - hash: 
              sha256:a9c6810c4b6be8b40be2709d0a6f423efdf2de58825faf51951333b2015cc6e3
            value: 
              奥瑞利安·索尔召唤一个黑洞，对敌人们造成伤害并缓慢地将他们拉拽向黑洞的中心。每有一名敌人在黑洞中阵亡，以及一名敌方英雄在黑洞中每被困住一秒，这个技能都会提供【星尘】。黑洞的中心会处决低于一定百分比最大生命值的敌人。【星尘】会提升【星芒凝汇】的区域以及处决阈值。
            first_seen: 16.5.1
            last_seen: 16.14.1
            similarity_to_previous:
            review_status: accepted
            sources:
              - source: data_dragon
                first_seen: 16.5.1
                last_seen: 16.14.1
              - source: game_data
                first_seen: '16.14'
                last_seen: '16.14'
