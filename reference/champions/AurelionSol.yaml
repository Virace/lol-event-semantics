          - hash: 
              sha256:2281bbb66bb6cd435798def0e24296c52b042d26df557b92f9c43c1a2b8a90c4
            value: 奥瑞利安 · 
              索尔沿着目标方向飞越地形。在这个状态下，他可以施放其它技能。飞行期间，星河冲荡没有冷却时间，也没有最长蓄力时间，并且造成的伤害会提升。<br><br>如果有敌方英雄因为奥瑞利安
              · 索尔近期造成的伤害阵亡，星穹流丽的冷却时间会缩短。<br><br>星尘会提升星穹流丽的最大飞行距离。
