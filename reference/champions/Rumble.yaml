      zh_CN:
        snapshots:
          - hash: 
              sha256:5925331cb7ff34135ecc484e00fd89e915d6a0a234c80cb1cc549ae24903e11c
            value: 
              兰博的技能都能使其获得热量。当兰博的热量达到50%时，他会处于危险温度状态，所有基础技能都会获得额外效果。当热量达到100%时，他会进入过热状态，获得额外的攻击速度并让他的普通攻击造成额外伤害，但也会让他在数秒内无法施放技能。
            first_seen: 16.5.1
            last_seen: 16.5.1
