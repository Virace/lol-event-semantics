              sha256:2fdaf35f856cf4e6f4bf426dd61e8aad54b84d16e8ddeccc287ec5ee11c488b4
            value: Every spell Rumble casts gives him Heat. When he reaches 50% 
              Heat he reaches Danger Zone, granting all his basic abilities 
              bonus effects. When he reaches 100% Heat, he starts Overheating, 
              gaining bonus Attack Speed and granting his basic attacks bonus 
              damage, but making him unable to cast spells for a few seconds.
            first_seen: '16.5'
            last_seen: 16.5.1
