            value: Graves dashes forward gaining an Armor and Magic Resist boost
              for several seconds. If Graves dashes towards an enemy champion, 
              gain two stacks of True Grit instead. Hitting enemies with basic 
              attacks lowers the cooldown of this skill and refreshes the 
              resistance boost.
