            version: '16.5'
    names:
      en_US:
        - value: Pix, Faerie Companion
          sources:
            - source: data_dragon
              version: 16.5.1
            - source: game_data
              version: '16.5'
      zh_CN:
        - value: 皮克斯，仙灵伙伴
          sources:
            - source: data_dragon
              version: 16.5.1
    descriptions:
      en_US:
        snapshots:
          - hash: 
              sha256:0eed8131be5af9da4024189b3bc2647d1ea6ba4f439aa3c405f1bd3a46646e27
            value: Pix fires magical bolts of energy whenever the champion he's 
              following attacks another enemy unit. These bolts are homing, but 
              can be intercepted by other units.
            first_seen: '16.5'
            last_seen: 16.5.1
            similarity_to_previous:
            review_status: accepted
            sources:
              - source: data_dragon
                version: 16.5.1
              - source: game_data
                version: '16.5'
      zh_CN:
        snapshots:
          - hash: 
              sha256:4d4ed755b3b8db85af8cbadfb22dc79fc6211ad5568e54401ab87537662ff64a
            value: 每当皮克斯正在跟随的英雄进行攻击时，皮克斯就会发射魔法飞弹。这些飞弹会自动寻敌，但也会被其它单位所拦截。
            first_seen: 16.5.1
            last_seen: 16.5.1
            similarity_to_previous:
            review_status: accepted
            sources:
              - source: data_dragon
                version: 16.5.1
