      en_US:
        snapshots:
          - hash: 
              sha256:624aeb0fd075d1a6dabc563cf823e7440310b5ea1669377c294aa941e8649224
            value: Jhin's hand cannon, Whisper, is a precise instrument designed
              to deal superior damage. It fires at a fixed rate and carries only
              four shots. Jhin imbues the final bullet with dark magics to 
              critically strike and deal bonus execute damage. Whenever Whisper 
              crits, it inspires Jhin with a burst of Move Speed.
            first_seen: '16.5'
            last_seen: 16.14.1
