            value: Jhin places an invisible lotus trap that blooms when walked 
              over. It slows nearby enemies before dealing damage with an 
              explosion of serrated petals. <br><br><font color='#FFFFFF'>Beauty
              in Death -</font> When Jhin kills an enemy champion, a lotus trap 
              will bloom near their corpse.
