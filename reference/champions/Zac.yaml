    descriptions:
      en_US:
        snapshots:
          - hash: 
              sha256:d807fedb1783c87e04a5e92898fb9915c56ac7dbc9b9c97946892c4e8bc98a51
            value: Each time Zac hits an enemy with an ability, he sheds a chunk
              of himself that can be reabsorbed to restore Health. Upon taking 
              fatal damage, Zac splits into 4 bloblets that attempt to 
              recombine. If any bloblets remain, he will revive with an amount 
              of Health depending on the Health of the surviving bloblets. Each 
              bloblet has a percentage of Zac's maximum Health, Armor and Magic 
              Resistance. This ability has a 5 minute cooldown.
            first_seen: '16.5'
            last_seen: 16.16.1
            similarity_to_previous:
            review_status: accepted
            sources:
              - source: data_dragon
                first_seen: 16.5.1
                last_seen: 16.16.1
              - source: game_data
                first_seen: '16.5'
                last_seen: '16.16'
