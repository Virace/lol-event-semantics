        snapshots:
          - hash:
              sha256:820d7fb4d807d19a09c415f80b68546ad6a5860dc53ac0921a2882677032e8f0
            value: In human form, Nidalee channels the spirit of the cougar to
              heal her allies and imbue them with Attack Speed for a short
              duration. As a cougar, she claws in a direction, dealing damage to
              enemies in front of her.
            first_seen: '16.5'
            last_seen: 16.20.8248524
