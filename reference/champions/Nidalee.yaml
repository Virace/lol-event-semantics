    descriptions:
      en_US:
        snapshots:
          - hash:
              sha256:a3e8e23aa344bcf949aa48110e4f2bb3318f4eeb4ce894d5b9cbde2b06b9a1b7
            value: Moving through brush increases Nidalee's Move Speed by 10%
              for 2 seconds, increased to 30% toward visible enemy champions
              within 1400 range.<br><br>Hitting champions or monsters with
              Javelin Toss or Bushwhack triggers a <font
              color='#FFF673'>Hunt</font>, granting <font color='#ee91d7'>True
              Sight</font> of them for 4 seconds. During this time, Nidalee
              gains 10% Move Speed (increased to 30% toward the <font
              color='#FFF673'>Hunted</font> target) and her Takedown and Pounce
              are enhanced against them.
            first_seen: '16.5'
            last_seen: 16.20.8248524
            similarity_to_previous:
            review_status: accepted
            sources:
              - source: data_dragon
                first_seen: 16.5.1
                last_seen: 16.20.1
              - source: game_data
                first_seen: '16.5'
                last_seen: 16.20.8248524
      zh_CN:
        snapshots:
          - hash:
              sha256:9334f0dee941efa772ae9d05573f49bef2413c0106d5d2d94df38d5ac22691ea
            value:
              在穿越草丛进行移动时，奈德丽的移动速度会提升10%，持续2秒，并在朝着1400码内的出现在己方视野内的敌方英雄进行移动时，移动速度加成会提升至30%。<br><br>在【Q标枪投掷】或【W丛林伏击】对敌方英雄或野怪造成伤害后，奈德丽会开始<font
              color='#FFF673'>捕猎</font>目标英雄，提供其<font
              color='#ee91d7'>真实视野</font>，持续4秒。在此期间，奈德丽获得10%移动速度加成（在她朝着<font
              color='#FFF673'>被捕猎</font>的目标移动时，这个加成会提升至30%）并且她的【Q推倒】和【W猛扑】会对这些目标造成强化伤害。
            first_seen: 16.5.1
            last_seen: 16.20.8248524
            similarity_to_previous:
            review_status: accepted
