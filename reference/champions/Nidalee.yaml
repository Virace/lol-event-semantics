              sha256:53d3c5ab5a8edb83c4fd7ac6699f29f2c1fadd3d4318513d38d6eae216e206e3
            value: 人类形态下，奈德丽引导美洲狮的灵魂以治疗友方单位，并且短暂提升他们的攻击速度。美洲狮形态下，她迅速的挥爪攻击她面前的敌人。
            first_seen: 16.5.1
