          - hash: 
              sha256:05995c85fea516c934c12ecc9e2617a23b5ec05e6e76f07a4d1f1cfc2b2eb2ad
            value: Kled throws a bear trap that damages and hooks an enemy 
              champion. If shackled for a short duration, the target takes 
              additional physical damage and is yanked toward Kled.<br><br>When 
              dismounted, this ability is replaced by Pocket Pistol, a ranged 
              gun blast that knocks back Kled and restores courage.
            first_seen: '16.5'
            last_seen: 16.5.1
            similarity_to_previous:
            review_status: accepted
            sources:
              - source: data_dragon
                version: 16.5.1
