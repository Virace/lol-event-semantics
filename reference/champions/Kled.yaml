              version: 16.5.1
    descriptions:
      en_US:
        snapshots:
          - hash: 
              sha256:0a88d2259667c02a541f9a4e3aae89e5c55aad7fa3548b59806f38feb8b37e1f
            value: Kled rides his trusty steed, Skaarl, who takes damage for 
              him. When Skaarl's health depletes, Kled dismounts.<br><br>While 
              dismounted, Kled's abilities change and he deals less damage to 
              champions. Kled can restore Skaarl's courage by fighting enemies. 
              At maximum courage, Kled remounts with a portion of Skaarl's 
              health.
            first_seen: '16.5'
            last_seen: 16.5.1
            similarity_to_previous:
            review_status: accepted
            sources:
              - source: data_dragon
                version: 16.5.1
              - source: game_data
                version: '16.5'
      zh_CN:
        snapshots:
          - hash: 
              sha256:e7cff2f534c140419d09d1c9eb7571d74610b169b921b714cb8db18cec127b33
            value: 
              克烈的可靠坐骑——斯嘎尔——会为他承受伤害。当斯嘎尔的生命值耗尽时，会导致克烈进入非骑乘状态。额外生命值属性只会施加给斯嘎尔。<br><br>在非骑乘状态下时，克烈会更换若干技能并对英雄造成较少伤害。克烈可通过与敌人作战来回复斯嘎尔的勇气。在勇气到达满值时，克烈会骑着拥有部分生命值的斯嘎尔重回骑乘状态。
            first_seen: 16.5.1
            last_seen: 16.5.1
            similarity_to_previous:
            review_status: accepted
            sources:
              - source: data_dragon
                version: 16.5.1
