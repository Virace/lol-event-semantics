      zh_CN:
        snapshots:
          - hash: 
              sha256:c5e60f0d8841c85e8d43ee88969f2f3a458a303329f06fda3c3802a82382f1e9
            value: 
              克烈投掷一个捕熊器，钩住一个敌人并造成伤害。如果短时间内牵引没有被打破，那么目标会受到额外物理伤害并被拽向克烈。<br><br>当处于非骑乘状态下时，这个技能会被替换为【随身手枪】——一个远程枪击技能，可将克烈击退并回复勇气值。
            first_seen: 16.5.1
            last_seen: 16.5.1
