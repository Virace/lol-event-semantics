      en_US:
        snapshots:
          - hash: 
              sha256:478218ce084fa0224ea0f081acae067fc215128ec773c83fa975500128fbe538
            value: <font color='#FF9900'>Meeps:</font> Bard attracts lesser 
              spirits that assist with his basic attacks to deal extra magic 
              damage. When Bard has collected enough  <font 
              color='#cccc00'>Chimes</font>, his meeps will also deal damage in 
              an area and slow enemies hit.<br><br><font 
              color='#FF9900'>Chimes:</font> Ancient <font 
              color='#cccc00'>chimes</font> randomly appear for Bard to collect.
              These grant experience, restore mana, and provide out of combat 
              Move Speed.
            first_seen: '16.5'
            last_seen: 16.16.1
            similarity_to_previous:
            review_status: accepted
            sources:
