          - hash: 
              sha256:4f4c0f4815e22aa51ada7d63065102d94194962a3a73588db0a0c92270d8d6c7
            value: <font 
              color='#FF9900'>木灵：</font>巴德吸引小型灵体来强化他的普攻以造成额外魔法伤害。当巴德收集到足够的<font 
              color='#cccc00'>调和之音</font>时，这些木灵还会造成范围伤害并使命中的敌人减速。<br><br><font 
              color='#FF9900'>调和之音：</font>远古的<font 
              color='#cccc00'>调和之音</font>会随机出现，用来让巴德收集。这些调和之音会提供经验值，回复法力值，并提供脱战状态下的移动速度加成。
            first_seen: 16.5.1
            last_seen: 16.16.1
