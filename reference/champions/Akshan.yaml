      en_US:
        snapshots:
          - hash: 
              sha256:368bcffa84626bef2dea00a56719dadea4074438b3f6df1a5269c5777286204f
            value: Akshan passively marks enemy champions as Scoundrels when 
              they kill his ally champions. If Akshan kills a Scoundrel, he 
              resurrects the allies they killed, gains bonus gold, and clears 
              all marks.<br><br>When activated, Akshan enters camouflage and 
              gains Move Speed and Mana Regen while moving towards Scoundrels. 
              Akshan loses the camouflage quickly while he is not in brush or 
              near terrain.
