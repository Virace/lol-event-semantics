        snapshots:
          - hash: 
              sha256:2dd8777d054917c12158671b2b46e24a5ae844d67e9f67e87be4e74325529bce
            value: Kayn wields an ancient weapon and fights Rhaast, the darkin 
              within it, for control. Either the <font 
              color='#fe5c50'>Darkin</font> will triumph, or Kayn will master 
              Rhaast and become the <font color='#8484fb'>Shadow 
              Assassin</font>.<br><br><font color='#fe5c50'>Darkin:</font> Heal 
              for a percentage of spell damage dealt to champions.<br><br><font 
              color='#8484fb'>Shadow Assassin:</font> For the first few seconds 
              in combat with enemy champions, deal bonus damage.
            first_seen: '16.5'
            last_seen: 16.5.1
            similarity_to_previous:
            review_status: accepted
            sources:
              - source: data_dragon
                version: 16.5.1
              - source: game_data
                version: '16.5'
      zh_CN:
        snapshots:
          - hash: 
              sha256:a90de8703ac21d5366cf3bdd1040ce1b1548ffaffddd7546d3dc3cc140090629
            value: 凯隐使用的是一把上古神兵，并且一直都在与附在武器上的暗裔灵体拉亚斯特为了身体的控制权而战斗着。要么<font 
              color='#fe5c50'>暗裔杀手</font>将获胜，要么凯隐将统御拉亚斯特并变为<font 
              color='#8484fb'>影流刺客</font>。<br><hr><font 
              color='#fe5c50'>暗裔杀手：</font>治疗自身，数额相当于一部分对敌方英雄造成的技能伤害值。<br><br><font
              color='#8484fb'>影流刺客：</font>在与敌方英雄作战的最初几秒里，造成额外伤害。
            first_seen: 16.5.1
            last_seen: 16.5.1
            similarity_to_previous:
            review_status: accepted
