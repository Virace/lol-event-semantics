        snapshots:
          - hash: 
              sha256:22e97b41dad6b90ef17eb530fc9d1adc2183af62f5541b1d26e8e73a9ec6c634
            value: 
              德莱厄斯磨利他的巨斧，被动地让他的物理伤害无视目标一部分护甲。在主动施放时，德莱厄斯会用斧头上的钩子横扫他的敌人，并将他们拉到德莱厄斯身边。
            first_seen: 16.5.1
            last_seen: 16.5.1
