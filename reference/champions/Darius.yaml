      zh_CN:
        snapshots:
          - hash: 
              sha256:3fb6dd671e3101e5f5875a43f0f356dbfd5de5fd4e0fa7d4efe0b8bd17df9cb8
            value: 
              德莱厄斯的攻击和伤害技能会导致敌人流血，在5秒里持续造成物理伤害，最多叠加5次。在他的目标达到最大层数后，德莱厄斯会进入激怒状态并获得巨额攻击力。
            first_seen: 16.5.1
            last_seen: 16.5.1
            similarity_to_previous:
            review_status: accepted
            sources:
              - source: data_dragon
                version: 16.5.1
