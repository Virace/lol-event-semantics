        snapshots:
          - hash: 
              sha256:a08988be67ef3b3856201a871be61885fc7022fe9f17d6a1e9b486f9c251e13f
            value: Darius' attacks and damaging abilities cause enemies to bleed
              for physical damage over 5 seconds, stacking up to 5 times. Darius
              enrages and gains massive Attack Damage when his target reaches 
              max stacks.
            first_seen: '16.5'
            last_seen: 16.5.1
            similarity_to_previous:
            review_status: accepted
            sources:
              - source: data_dragon
                version: 16.5.1
