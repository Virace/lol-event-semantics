      en_US:
        snapshots:
          - hash: 
              sha256:3bc9731c26da813d2c8faee71bcd567fa37b799806315acaa896ae3240fe69dd
            value: Darius hones his axe, passively causing his physical damage 
              to ignore a percentage of his target's Armor. When activated, 
              Darius sweeps up his enemies with his axe's hook and pulls them to
              him.
            first_seen: '16.5'
