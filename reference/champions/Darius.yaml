              sha256:68cf21c98fcb05d0eb18f8bbc9a94611cf2cf92f63e34ae552f6318f9acd2cd3
            value: 
              德莱厄斯蓄力然后将他的斧头挥舞成一个大圈。被斧刃击中的敌人会比被斧柄击中的敌人受到更多伤害。德莱厄斯会基于被斧刃击中的敌方英雄或大型野怪的数量来获得治疗效果。
            first_seen: 16.5.1
            last_seen: 16.5.1
