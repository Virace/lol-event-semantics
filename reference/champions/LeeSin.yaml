      en_US:
        - value: Safeguard / Iron Will
          sources:
            - source: data_dragon
              version: 16.5.1
            - source: game_data
              version: '16.5'
      zh_CN:
        - value: 金钟罩/铁布衫
          sources:
            - source: data_dragon
              version: 16.5.1
    descriptions:
      en_US:
        snapshots:
          - hash: 
              sha256:e7891d0945740906d00aa90e4c02581d9e494ce4e710308a22a505ba023dae43
            value: "Safeguard: Lee Sin rushes to target ally, shielding himself from
              damage. If the ally is a champion, they are also shielded. After using
              Safeguard, Lee Sin can cast Iron Will.<br>Iron Will: Lee Sin's intense
              training allows him to thrive in battle. Lee Sin gains Omnivamp."
            first_seen: '16.5'
            last_seen: 16.5.1
            similarity_to_previous:
            review_status: accepted
            sources:
              - source: data_dragon
                version: 16.5.1
              - source: game_data
                version: '16.5'
      zh_CN:
        snapshots:
          - hash: 
              sha256:69908d42ccbf15ea9622608eda70fb8e6eeba823431401859790f8d9041a8805
            value: 
              金钟罩：李青冲向目标友军，为他自身提供护盾值。如果该友军是一名英雄，则也会获得护盾值。在使用【金钟罩】后，李青可以施放【铁布衫】。<br>铁布衫：李青艰苦卓绝的训练让他能在战斗中激发潜能。李青获得全能吸血。
            first_seen: 16.5.1
            last_seen: 16.5.1
            similarity_to_previous:
            review_status: accepted
            sources:
              - source: data_dragon
                version: 16.5.1
