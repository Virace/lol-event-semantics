              version: '16.5'
      zh_CN:
        - value: 天音波/回音击
          sources:
            - source: data_dragon
              version: 16.5.1
    descriptions:
      en_US:
        snapshots:
          - hash: 
              sha256:be0183bdf3acd0fdff414be12d97c82ae225c4e51ebdbf3896e3f7add5c7948f
            value: "Sonic Wave: Lee Sin projects a discordant wave of sound to locate
              his enemies, dealing physical damage to the first enemy it encounters.
              If Sonic Wave hits, Lee Sin can cast Resonating Strike for the next
              3 seconds.<br>Resonating Strike: Lee Sin dashes to the enemy hit by
              Sonic Wave, dealing physical damage based on the target's missing Health."
            first_seen: '16.5'
            last_seen: 16.5.1
            similarity_to_previous:
            review_status: accepted
            sources:
              - source: data_dragon
                version: 16.5.1
              - source: game_data
                version: '16.5'
      zh_CN:
        snapshots:
          - hash: 
              sha256:729efb8d0cdbe06bdb7b4ce470b5489eb0f6fc44f5f5ff52ff7490fd958bebc7
            value: 
              天音波：李青发出刺耳的声波定位敌人，对首个敌人造成物理伤害。如果天音波击中敌人，李青在接下来3秒可施放回音击。<br>回音击：李青冲向被天音波击中的敌人，造成基于该目标已损失生命值的物理伤害。
            first_seen: 16.5.1
            last_seen: 16.5.1
            similarity_to_previous:
            review_status: accepted
            sources:
              - source: data_dragon
                version: 16.5.1
