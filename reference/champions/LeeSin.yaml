    descriptions:
      en_US:
        snapshots:
          - hash: 
              sha256:505f58e64ccb1cd530e29f4b827552a406737ee23cfff78e138ca6eb3f678a4d
            value: Lee Sin performs a powerful roundhouse kick launching his 
              target back, dealing physical damage to the target and any enemies
              they collide with. Enemies the target collides with are knocked 
              into the air for a short duration. This technique was taught to 
              him by Jesse Perring, although Lee Sin does not kick players off 
              the map.
            first_seen: '16.5'
            last_seen: 16.5.1
            similarity_to_previous:
            review_status: accepted
            sources:
              - source: data_dragon
                version: 16.5.1
              - source: game_data
                version: '16.5'
      zh_CN:
        snapshots:
          - hash: 
              sha256:1ee452f90196a3cf5941121ade427eb4bc93915481fc0299e461a4f0b9a5671a
            value: 李青用强力的回旋踢击退敌方英雄，对目标以及被目标撞到的任何敌人造成物理伤害。 
              被目标撞到的敌人会被短暂击飞。这项技艺是春哥教他的，不过李青不能将玩家的英雄踢到地图外面去。
            first_seen: 16.5.1
            last_seen: 16.5.1
            similarity_to_previous:
            review_status: accepted
            sources:
              - source: data_dragon
                version: 16.5.1
