    descriptions:
      en_US:
        snapshots:
          - hash: 
              sha256:53b6154f3954d66d4b2b76f66d3bcf94c86a0a3de010934e929105c4f2f331dd
            value: 'Tempest: Lee Sin smashes the ground, sending out a shockwave that
              deals magic damage and reveals enemy units hit. If Tempest hits an enemy,
              Lee Sin can cast cripple.<br>Cripple: Lee Sin cripples nearby enemies
              damaged by Tempest, reducing their Move Speed. Move Speed recovers gradually
              over the duration.'
            first_seen: '16.5'
            last_seen: 16.5.1
            similarity_to_previous:
            review_status: accepted
            sources:
              - source: data_dragon
                version: 16.5.1
              - source: game_data
                version: '16.5'
      zh_CN:
        snapshots:
          - hash: 
              sha256:025306de93ce59d5be7a5f1be48c370e0fc3b7ec043df1ed24960c78b2ed95d7
            value: 
              天雷破：李青猛击地面，施放冲击波，造成魔法伤害并使命中的敌方单位显形。如果天雷破命中了一名敌人，那么李青可以施放【摧筋断骨】。<br>摧筋断骨：李青致残被天雷破给伤害到的敌人，减少其移动速度。持续期间受影响单位的移动速度会逐渐恢复正常。
            first_seen: 16.5.1
            last_seen: 16.5.1
            similarity_to_previous:
            review_status: accepted
            sources:
              - source: data_dragon
                version: 16.5.1
