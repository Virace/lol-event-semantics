              sha256:e8a311ab86f1b0e1994f0a6dbd286b9072a9b0f38aa9200e7f36b7a22a80fcd7
            value: Master Yi teleports across the battlefield with blinding 
              speed, dealing physical damage to multiple units in his path, 
              while simultaneously becoming untargetable. Alpha Strike can 
              critically strike and deals bonus physical damage to monsters. 
              Basic attacks reduce Alpha Strike's cooldown.
