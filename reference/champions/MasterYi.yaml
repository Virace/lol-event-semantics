          - hash: 
              sha256:9fba787f1514f4aecd86b38f8505b3856c0fa4de07247364b906124bab240978
            value: 
              易以肉眼难以发觉的速度穿梭于战场，对多个敌人造成物理伤害，同时处于不可被选取的状态下。阿尔法突袭可以暴击，并对野怪造成额外物理伤害。普通攻击可以减少阿尔法突袭的冷却时间。
            first_seen: 16.5.1
            last_seen: 16.16.1
            similarity_to_previous:
