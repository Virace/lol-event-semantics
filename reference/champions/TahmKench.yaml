      en_US:
        snapshots:
          - hash: 
              sha256:099ac568f9537a2ff75b62fd23907ae40fb6549583c541bef61cce60a5324c44
            value: Tahm Kench puts the heft of his immense body behind his 
              attacks, gaining extra damage based on his total health. Damaging 
              enemy champions builds stacks of <spellName>An Acquired 
              Taste</spellName>. At three stacks, he can use 
              <spellName>Devour</spellName> on an enemy champion.
            first_seen: '16.5'
            last_seen: 16.5.1
            similarity_to_previous:
            review_status: accepted
            sources:
              - source: data_dragon
                version: 16.5.1
              - source: game_data
                version: '16.5'
      zh_CN:
        snapshots:
          - hash: 
              sha256:c87e2a5a4d2158503fb3c8489152df3eee7cf0918714956251a6abf1110e0641
            value: 
              塔姆将他那庞大身躯的分量夹杂在他的攻击和技能中，从而使他能造成基于自身总生命值的额外伤害。对敌方英雄造成伤害时，塔姆可以在目标身上叠加<spellName>培养品味</spellName>的层数。当敌方英雄身上的层数到达3时，塔姆可以使用<spellName>大快朵颐</spellName>来吞噬这名敌方英雄。
            first_seen: 16.5.1
            last_seen: 16.5.1
            similarity_to_previous:
            review_status: accepted
            sources:
              - source: data_dragon
                version: 16.5.1
