              sha256:e3101364286f6eeb60b4185ea237005981debff86274ff7b95e8cc843876931d
            value: Tahm Kench lashes out with his tongue, damaging and slowing 
              the first unit hit and healing himself if he strikes an enemy 
              champion.<br><br>Applies a stack of  <spellName>An Acquired 
              Taste</spellName> to enemy champions. If the champion already has 
              3 stacks of <spellName>An Acquired Taste</spellName>, they are 
              stunned and the stacks are consumed.
            first_seen: '16.5'
            last_seen: 16.5.1
            similarity_to_previous:
            review_status: accepted
            sources:
              - source: data_dragon
                version: 16.5.1
