    descriptions:
      en_US:
        snapshots:
          - hash: 
              sha256:c0c46e276636a275a5dc358cd3c73445a3a915433cdf62c64d4fca1450e6fa71
            value: Brand's spells light his targets ablaze, dealing damage over 
              4 seconds, stacking up to 3 times. If Brand kills an enemy while 
              it is ablaze he regains mana. When Blaze reaches max stacks on a 
              Champion or large monster, it becomes unstable. It detonates in 2 
              seconds, applying spell effects and dealing massive damage in an 
              area around the victim.
            first_seen: '16.5'
            last_seen: 16.16.1
            similarity_to_previous:
            review_status: accepted
            sources:
              - source: data_dragon
                first_seen: 16.5.1
                last_seen: 16.16.1
              - source: game_data
                first_seen: '16.5'
                last_seen: '16.16'
      zh_CN:
        snapshots:
          - hash: 
              sha256:41724b2b09f63abdb88d1a53cfa572af89049aec51e0db7d8b414831cad52477
            value: 
              布兰德的技能会对他的目标施加【烈焰焚身】效果，在4秒里持续造成伤害，最多可叠加3次。如果布兰德击杀了身上带有【烈焰焚身】的敌人，那么他会回复法力值。当【炽热之焰】在一名英雄或大型野怪身上叠至满层时，它会变得不稳定。它会在2秒内爆炸，在目标附近的区域施加法术特效并造成大量伤害。
            first_seen: 16.5.1
            last_seen: 16.16.1
            similarity_to_previous:
            review_status: accepted
            sources:
              - source: data_dragon
                first_seen: 16.5.1
                last_seen: 16.16.1
