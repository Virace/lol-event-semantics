            value: Hwei primes enemy champions he damages with his abilities for
              his signature finishing touch.<br><br>Hitting an enemy with a 
              second damaging spell completes his signature, leaving it beneath 
              them. The signature detonates after a short delay, dealing magic 
              damage to all enemies in range.
