              last_seen: 16.20.8248524
    descriptions:
      en_US:
        snapshots:
          - hash:
              sha256:d4a715482b346e5a03cad234190c8bf3abb18b9f847073e2308f6874b3f816bd
            value: If cast on an ally, commands Pix to jump to an ally and
              shield them. He then follows them and aids their attacks. If cast
              on an enemy, commands Pix to jump to an enemy and damage them. He
              then follows them and grants you vision of that enemy.
            first_seen: '16.16'
            last_seen: 16.20.8248524
            similarity_to_previous:
            review_status: accepted
            sources:
              - source: game_data
                first_seen: '16.16'
                last_seen: 16.20.8248524
      zh_CN:
        snapshots:
          - hash:
              sha256:87fceaa59803b0a1367a98f0f10a0741316c065d32cdca374648add0bc6ea9f9
            value:
              如果对友军施放，会命令皮克斯跳到一名友军身上进行保护，之后会跟随并协助目标（而不是璐璐）进行攻击。如果对敌人施放，皮克斯会跳到敌人身上造成伤害，之后会跟随并提供目标的视野。
            first_seen: '16.16'
            last_seen: 16.20.8248524
            similarity_to_previous:
            review_status: accepted
            sources:
              - source: game_data
                first_seen: '16.16'
                last_seen: 16.20.8248524
