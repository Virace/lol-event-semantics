              sha256:0eed8131be5af9da4024189b3bc2647d1ea6ba4f439aa3c405f1bd3a46646e27
            value: Pix fires magical bolts of energy whenever the champion he's
              following attacks another enemy unit. These bolts are homing, but
              can be intercepted by other units.
