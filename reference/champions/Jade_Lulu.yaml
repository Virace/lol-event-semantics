              sha256:4d4ed755b3b8db85af8cbadfb22dc79fc6211ad5568e54401ab87537662ff64a
            value: 每当皮克斯正在跟随的英雄进行攻击时，皮克斯就会发射魔法飞弹。这些飞弹会自动寻敌，但也会被其它单位所拦截。
            first_seen: '16.16'
