      zh_CN:
        - value: 赦除
          sources:
            - source: data_dragon
              first_seen: 16.5.1
              last_seen: 16.16.1
            - source: game_data
              first_seen: '16.14'
              last_seen: '16.16'
    descriptions:
      en_US:
        snapshots:
          - hash: 
              sha256:56a84196a72a5fb01b3de0559eaa79cb79d7491be0788955ad514733a35d4a68
            value: When units die near Senna, their souls are periodically 
              trapped by the Black Mist. Senna can attack these souls to free 
              them, absorbing the Mist that held them in death. Mist fuels her 
              Relic Cannon's power with increased Attack Damage, Attack Range, 
              and Critical Strike Chance. <br><br>Attacks from Senna's Relic 
              Cannon take longer to fire, deal bonus damage, and briefly grant 
              her a portion of her target's Move Speed.
            first_seen: '16.5'
            last_seen: 16.16.1
            similarity_to_previous:
            review_status: accepted
            sources:
              - source: data_dragon
                first_seen: 16.5.1
                last_seen: 16.16.1
              - source: game_data
                first_seen: '16.5'
                last_seen: '16.16'
      zh_CN:
        snapshots:
          - hash: 
              sha256:fe2c87336fc2a5af3f20cec5319e459eb7338550f4d669cd07e1e33e5ba85883
            value: 
              当赛娜附近有单位死亡时，这些单位的灵魂会周期性地被黑雾所捕获。赛娜可以攻击这些灵魂来解脱他们，并吸收使他们困在死界的黑雾。黑雾会为她的圣枪提供燃料，提升她的攻击力、攻击距离和暴击几率。<br><br>赛娜的圣物火炮需要更长的射击时间，造成额外伤害，并暂时为她提供她目标的一部分移动速度。
            first_seen: 16.5.1
            last_seen: 16.16.1
            similarity_to_previous:
            review_status: accepted
            sources:
              - source: data_dragon
                first_seen: 16.5.1
