              first_seen: 16.5.1
              last_seen: 16.16.1
            - source: game_data
              first_seen: '16.14'
              last_seen: '16.16'
    descriptions:
      en_US:
        snapshots:
          - hash: 
              sha256:cb4f0ce311518f451f73fb296f1017404f8de204feacaf2530e385546b586aff
            value: Senna draws the Mist she has stored in her weapon into a 
              storm around her, embracing darkness and becoming a wraith within.
              Allies who enter the area are camouflaged and also appear as 
              wraiths as the Mist shrouds them. Wraiths gain increased Move 
              Speed, are unselectable, and hide their identities.
            first_seen: '16.5'
            last_seen: 16.16.1
            similarity_to_previous:
            review_status: accepted
            sources:
              - source: data_dragon
                first_seen: 16.5.1
                last_seen: 16.16.1
              - source: game_data
                first_seen: '16.5'
                last_seen: '16.16'
      zh_CN:
        snapshots:
          - hash: 
              sha256:f6b83f27dc804f7cd5f6774c8f70c3ba08b99cdcc1648a252bf4f13b9661113d
            value: 
              赛娜将她存在武器内的黑雾抽出，在她四周形成一团风暴，然后投身于黑暗并变成幽魂。进入黑雾区域的友军会变成伪装状态，并且在被黑雾笼罩时也会呈现出幽灵的外观。幽魂会获得移动速度提升，无法被选中，并且隐藏自身的身份。
            first_seen: 16.5.1
            last_seen: 16.16.1
            similarity_to_previous:
            review_status: accepted
            sources:
              - source: data_dragon
                first_seen: 16.5.1
                last_seen: 16.16.1
              - source: game_data
                first_seen: '16.14'
                last_seen: '16.16'
