              天音波：李青发出刺耳的声波定位敌人，对命中的首个敌人造成物理伤害。如果天音波击中敌人，则李青在接下来3秒可施放回音击。<br>回音击：李青冲向被天音波击中的敌人，造成物理伤害外加目标8%已损失生命值的伤害。
