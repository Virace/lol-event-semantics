[project]
name = "lol-event-semantics"
version = "0.1.0"
description = "League of Legends audio event semantics datasets, rules, and tooling."
authors = [
    { name = "Virace", email = "Virace2020@outlook.com" }
]
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "league-tools>=1.1.5",
    "msgpack>=1.1.2",
    "ruamel-yaml>=0.19.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lol_event_semantics"]
