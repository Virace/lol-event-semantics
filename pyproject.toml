[project]
name = "lol-event-semantics"
version = "0.1.0"
description = "League of Legends audio event semantics datasets, rules, and tooling."
authors = [
    { name = "Virace", email = "Virace2020@outlook.com" }
]
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "league-tools>=1.2.0",
    "msgpack>=1.1.2",
    "ruamel-yaml>=0.19.1",
    "ruamel-yaml-clib>=0.2.15",
]

[project.scripts]
lookup-normalized-event = "lol_event_semantics.normalized_lookup_cli:main"

[project.optional-dependencies]
download = [
    "riotmanifest>=2.4.3",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=8",
    "ruff>=0.16.0",
]

[tool.uv]
# zstd 1.5.7.3 已被上游撤回；约束传递依赖，避免重新锁定时再次选中。
constraint-dependencies = ["zstd==1.5.7.2"]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src"]

[tool.ruff.lint]
# 先守住会导致代码无法导入或运行的错误；扩大规则集应作为独立清债任务。
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
show_error_codes = true
# 现阶段只把已经完整注解且边界稳定的核心模型与编排模块纳入 strict 门禁。
files = [
    "src/lol_event_semantics/__init__.py",
    "src/lol_event_semantics/_version.py",
    "src/lol_event_semantics/advisory_lock.py",
    "src/lol_event_semantics/collection.py",
    "src/lol_event_semantics/collection_discovery.py",
    "src/lol_event_semantics/collection_sources.py",
    "src/lol_event_semantics/dataset_identity.py",
    "src/lol_event_semantics/dataset_runs.py",
    "src/lol_event_semantics/consumption.py",
    "src/lol_event_semantics/identity_migration.py",
    "src/lol_event_semantics/entity_attribution.py",
    "src/lol_event_semantics/full_refresh.py",
    "src/lol_event_semantics/model.py",
    "src/lol_event_semantics/mode_namespace.py",
    "src/lol_event_semantics/normalized_lookup_cli.py",
    "src/lol_event_semantics/normalized_translation_model.py",
    "src/lol_event_semantics/pattern_catalog.py",
    "src/lol_event_semantics/product_review.py",
    "src/lol_event_semantics/review_decisions.py",
    "src/lol_event_semantics/reference_snapshot.py",
    "src/lol_event_semantics/riotmanifest_transport.py",
    "src/lol_event_semantics/source_manifest.py",
    "src/lol_event_semantics/update_pipeline.py",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lol_event_semantics"]
