# 人工实体归属决策：约束缺少强证据时的 champion alias 回退。
#
# 来源：人工 review normalized/entity-summary.json 中无法自动归一的 champion alias。
# 来源资产与 reference 精确证据优先；keep / downgrade 不得覆写强来源，冲突保持未知。
# 匹配大小写不敏感；decision 取值：
#   keep      —— 保留原 alias 并阻止低证据回退；单凭此决定不能确认独立实体。
#   champion  —— 直接归入指定 reference 英雄（champion 字段必填，须存在于 reference/champions）。
#   downgrade —— 无法证明是英雄，统一归属层保持 unknown；kind 保留兼容输入约束。
# 每条必须带 note 说明证据；加载时 fail-fast 校验。
version: curated
champion_aliases:
  - alias: Ruby
    decision: keep
    note: 教程 bot 独立实体；reference 收录 Ruby_Amumu 等分身条目，但事件 owner 是 Ruby 本体，保留独立不归并。
  - alias: "578"
    decision: downgrade
    kind: unknown
    note: Switch_CHAMP_578_* 开关值（Kaisa bank 145.txt），578 在 reference/champions 无对应 id，无法证明指向英雄。
  - alias: "7232"
    decision: downgrade
    kind: unknown
    note: Switch_CHAMP_7232_* 开关值（Kaisa bank 145.txt），7232 在 reference/champions 无对应 id，无法证明指向英雄。
  - alias: New
    decision: downgrade
    kind: unknown
    note: New_Event 是 Wwise 编辑器占位事件（低信任规则 low_trust_event_0004），不是英雄实体。
